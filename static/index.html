<html lang="fr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="preconnect" href="https://fonts.googleapis.com" />

<script type="text/babel" data-type="module" data-presets="react">
import React, { useState, useEffect, useCallback } from "react";
import { createRoot } from "react-dom/client";
import { Car, TrendingUp, Users, LogOut, Plus, X, Pencil, Trash2, ShieldCheck } from "lucide-react";

// ---------- API ----------

async function api(path, options = {}) {
  const res = await fetch(path, {
    method: options.method || "GET",
    headers: options.body ? { "Content-Type": "application/json" } : undefined,
    body: options.body ? JSON.stringify(options.body) : undefined,
    credentials: "same-origin",
  });
  const isJson = res.headers.get("content-type")?.includes("application/json");
  const data = isJson ? await res.json() : null;
  if (!res.ok) {
    throw new Error((data && data.error) || `Erreur ${res.status}`);
  }
  return data;
}

const fmtEUR = (n) =>
  new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(n || 0);

// ---------- App ----------

export default function App() {
  const [chargement, setChargement] = useState(true);
  const [utilisateur, setUtilisateur] = useState(null);
  const [entreprises, setEntreprises] = useState([]);
  const [commerciaux, setCommerciaux] = useState([]);
  const [dossiers, setDossiers] = useState([]);
  const [dossiersTous, setDossiersTous] = useState([]);
  const [entrepriseFiltre, setEntrepriseFiltre] = useState("toutes");
  const [commercialFiltre, setCommercialFiltre] = useState("tous");
  const [anneeFiltre, setAnneeFiltre] = useState("toutes");
  const [moisFiltre, setMoisFiltre] = useState("tous");
  const [vue, setVue] = useState("dossiers");
  const [modalDossier, setModalDossier] = useState(null); // null | {} | dossier existant
  const [modalCommercial, setModalCommercial] = useState(null);
  const [modalEntreprise, setModalEntreprise] = useState(null); // null | {} | entreprise existante
  const [erreur, setErreur] = useState("");
  const [kpiOrder, setKpiOrder] = useState(null);

  const estAdmin = utilisateur?.role === "admin";
  const estAnimateur = utilisateur?.role === "animateur";
  const peutToutVoir = estAdmin || estAnimateur;

  useEffect(() => {
    setKpiOrder(utilisateur?.kpi_order || null);
  }, [utilisateur?.id]);

  const reorganiserKpis = async (nouvelOrdre) => {
    setKpiOrder(nouvelOrdre);
    try {
      await api("/api/preferences/kpi-order", { method: "PUT", body: { order: nouvelOrdre } });
    } catch (e) {
      setErreur(e.message);
    }
  };

  const chargerReferentiels = useCallback(async () => {
    const [ent, com] = await Promise.all([api("/api/entreprises"), api("/api/commerciaux")]);
    setEntreprises(ent);
    setCommerciaux(com);
  }, []);

  const chargerDossiers = useCallback(async (filtre) => {
    const qs = filtre && filtre !== "toutes" ? `?entreprise_id=${filtre}` : "";
    const rows = await api(`/api/dossiers${qs}`);
    setDossiers(rows);
  }, []);

  const chargerDossiersTous = useCallback(async () => {
    const rows = await api("/api/dossiers");
    setDossiersTous(rows);
  }, []);

  useEffect(() => {
    (async () => {
      try {
        const me = await api("/api/me");
        setUtilisateur(me);
        await Promise.all([chargerReferentiels(), chargerDossiers("toutes"), chargerDossiersTous()]);
      } catch {
        setUtilisateur(null);
      } finally {
        setChargement(false);
      }
    })();
  }, [chargerReferentiels, chargerDossiers, chargerDossiersTous]);

  useEffect(() => {
    if (utilisateur) chargerDossiers(entrepriseFiltre);
  }, [entrepriseFiltre, utilisateur, chargerDossiers]);

  const handleConnexion = async (me) => {
    setUtilisateur(me);
    setChargement(true);
    try {
      await Promise.all([chargerReferentiels(), chargerDossiers("toutes"), chargerDossiersTous()]);
    } finally {
      setChargement(false);
    }
  };

  const handleDeconnexion = async () => {
    await api("/api/logout", { method: "POST" });
    setUtilisateur(null);
    setEntreprises([]);
    setCommerciaux([]);
    setDossiers([]);
    setDossiersTous([]);
    setVue("dossiers");
  };

  const rafraichir = async () => {
    await Promise.all([chargerReferentiels(), chargerDossiers(entrepriseFiltre), chargerDossiersTous()]);
  };

  if (chargement) {
    return <div style={styles.pageChargement}>Chargement…</div>;
  }

  if (!utilisateur) {
    return <EcranConnexion onConnexion={handleConnexion} />;
  }

  const anneesDisponibles = [...new Set(dossiersTous.map((d) => d.date.slice(0, 4)))].sort((a, b) => b.localeCompare(a));

  const dossiersAffiches = dossiers.filter((d) => {
    if (commercialFiltre !== "tous" && String(d.commercial_id) !== commercialFiltre) return false;
    if (anneeFiltre !== "toutes" && d.date.slice(0, 4) !== anneeFiltre) return false;
    if (moisFiltre !== "tous" && d.date.slice(5, 7) !== moisFiltre) return false;
    return true;
  });

  return (
    <div style={styles.page}>
      <TickerBandeau entreprises={entreprises} dossiers={dossiersTous} />
      <EnTete utilisateur={utilisateur} onDeconnexion={handleDeconnexion} />

      <div style={styles.corps}>
        {erreur && (
          <div style={styles.bandeauErreur}>
            {erreur}
            <button style={styles.fermerErreur} onClick={() => setErreur("")}><X size={14} /></button>
          </div>
        )}

        {peutToutVoir && (
          <div style={styles.ongletsRangee}>
            <button
              style={{ ...styles.onglet, ...(vue === "dossiers" ? styles.ongletActif : {}) }}
              onClick={() => setVue("dossiers")}
            >
              Dossiers
            </button>
            <button
              style={{ ...styles.onglet, ...(vue === "equipe" ? styles.ongletActif : {}) }}
              onClick={() => setVue("equipe")}
            >
              Équipe &amp; entreprises
            </button>
          </div>
        )}

        {vue === "dossiers" && (
          <>
            {peutToutVoir && (
              <FiltreEntreprises
                entreprises={entreprises}
                entrepriseFiltre={entrepriseFiltre}
                setEntrepriseFiltre={setEntrepriseFiltre}
              />
            )}

            {peutToutVoir && (
              <FiltreCommercial
                commerciaux={commerciaux}
                commercialFiltre={commercialFiltre}
                setCommercialFiltre={setCommercialFiltre}
              />
            )}

            <FiltrePeriode
              anneesDisponibles={anneesDisponibles}
              anneeFiltre={anneeFiltre}
              setAnneeFiltre={setAnneeFiltre}
              moisFiltre={moisFiltre}
              setMoisFiltre={setMoisFiltre}
            />

            <KpiRangee
              dossiers={dossiersAffiches}
              estAdmin={peutToutVoir}
              peutReorganiser={estAdmin}
              kpiOrder={kpiOrder}
              onReorder={reorganiserKpis}
            />

            <div style={styles.sectionHeader}>
              <h2 style={styles.sectionTitre}>Dossiers</h2>
              {!estAnimateur && (
                <button style={styles.boutonAjout} onClick={() => setModalDossier({})}>
                  <Plus size={16} strokeWidth={2.5} /> Nouveau dossier
                </button>
              )}
            </div>

            <TableauVentes
              dossiers={dossiersAffiches}
              estAdmin={peutToutVoir}
              peutModifier={!estAnimateur}
              onModifier={(d) => setModalDossier(d)}
              onSupprimer={async (d) => {
                if (!confirm(`Supprimer le dossier de ${d.client} ?`)) return;
                try {
                  await api(`/api/dossiers/${d.id}`, { method: "DELETE" });
                  await rafraichir();
                } catch (e) {
                  setErreur(e.message);
                }
              }}
            />
          </>
        )}

        {vue === "equipe" && peutToutVoir && (
          <EquipeEtEntreprises
            entreprises={entreprises}
            commerciaux={commerciaux}
            estAdmin={estAdmin}
            onNouvelleEntreprise={() => setModalEntreprise({})}
            onModifierEntreprise={(e) => setModalEntreprise(e)}
            onNouveauCommercial={() => setModalCommercial({})}
            onModifierCommercial={(c) => setModalCommercial(c)}
          />
        )}
      </div>

      {modalDossier && (
        <ModalDossier
          dossier={modalDossier}
          estAdmin={estAdmin}
          commerciaux={commerciaux}
          utilisateur={utilisateur}
          onFermer={() => setModalDossier(null)}
          onValider={async (payload) => {
            try {
              if (payload.id) {
                await api(`/api/dossiers/${payload.id}`, { method: "PUT", body: payload });
              } else {
                await api("/api/dossiers", { method: "POST", body: payload });
              }
              setModalDossier(null);
              await rafraichir();
            } catch (e) {
              setErreur(e.message);
            }
          }}
        />
      )}

      {modalCommercial && (
        <ModalCommercial
          commercial={modalCommercial}
          entreprises={entreprises}
          onFermer={() => setModalCommercial(null)}
          onValider={async (payload) => {
            try {
              if (payload.id) {
                await api(`/api/commerciaux/${payload.id}`, { method: "PUT", body: payload });
              } else {
                await api("/api/commerciaux", { method: "POST", body: payload });
              }
              setModalCommercial(null);
              await rafraichir();
            } catch (e) {
              setErreur(e.message);
            }
          }}
        />
      )}

      {modalEntreprise && (
        <ModalEntreprise
          entreprise={modalEntreprise}
          onFermer={() => setModalEntreprise(null)}
          onValider={async (payload) => {
            try {
              if (payload.id) {
                await api(`/api/entreprises/${payload.id}`, { method: "PUT", body: payload });
              } else {
                await api("/api/entreprises", { method: "POST", body: payload });
              }
              setModalEntreprise(null);
              await rafraichir();
            } catch (e) {
              setErreur(e.message);
            }
          }}
        />
      )}
    </div>
  );
}

// ---------- Écran de connexion ----------

function EcranConnexion({ onConnexion }) {
  const [mode, setMode] = useState("connexion"); // connexion | recuperation
  const [identifiant, setIdentifiant] = useState("");
  const [motDePasse, setMotDePasse] = useState("");
  const [erreur, setErreur] = useState("");
  const [enCours, setEnCours] = useState(false);

  const connecter = async (e) => {
    e.preventDefault();
    setErreur("");
    setEnCours(true);
    try {
      const me = await api("/api/login", { method: "POST", body: { identifiant, mot_de_passe: motDePasse } });
      onConnexion(me);
    } catch (err) {
      setErreur(err.message);
    } finally {
      setEnCours(false);
    }
  };

  return (
    <div style={styles.pageConnexion}>
      {mode === "connexion" ? (
        <form style={styles.carteConnexion} onSubmit={connecter}>
          <div style={styles.logoConnexion}>
            <img src="/logo.png" alt="H.S.E Motors" style={styles.logoImage} />
          </div>
          <p style={styles.sousTitreConnexion}>Connectez-vous à votre espace</p>

          <label style={styles.champLabel}>
            Identifiant
            <input
              style={styles.input}
              value={identifiant}
              onChange={(e) => setIdentifiant(e.target.value)}
              placeholder="ex: admin"
              autoFocus
            />
          </label>

          <label style={styles.champLabel}>
            Mot de passe
            <input
              style={styles.input}
              type="password"
              value={motDePasse}
              onChange={(e) => setMotDePasse(e.target.value)}
              placeholder="••••••••"
            />
          </label>

          {erreur && <div style={styles.erreurConnexion}>{erreur}</div>}

          <button style={{ ...styles.boutonConnexion, opacity: enCours ? 0.6 : 1 }} disabled={enCours} type="submit">
            {enCours ? "Connexion…" : "Entrer"}
          </button>

          <button
            type="button"
            style={styles.lienMotDePasseOublie}
            onClick={() => { setMode("recuperation"); setErreur(""); }}
          >
            Mot de passe oublié ?
          </button>
        </form>
      ) : (
        <RecuperationMotDePasse onRetour={() => setMode("connexion")} />
      )}
    </div>
  );
}

// ---------- Récupération mot de passe admin ----------

function RecuperationMotDePasse({ onRetour }) {
  const [etape, setEtape] = useState("demande"); // demande | saisie
  const [identifiant, setIdentifiant] = useState("admin");
  const [code, setCode] = useState("");
  const [nouveauMotDePasse, setNouveauMotDePasse] = useState("");
  const [confirmation, setConfirmation] = useState("");
  const [erreur, setErreur] = useState("");
  const [message, setMessage] = useState("");
  const [enCours, setEnCours] = useState(false);

  const demanderCode = async (e) => {
    e.preventDefault();
    setErreur("");
    setEnCours(true);
    try {
      const res = await api("/api/mot-de-passe-oublie", { method: "POST", body: { identifiant } });
      setMessage(res.message);
      setEtape("saisie");
    } catch (err) {
      setErreur(err.message);
    } finally {
      setEnCours(false);
    }
  };

  const reinitialiser = async (e) => {
    e.preventDefault();
    setErreur("");
    if (nouveauMotDePasse !== confirmation) {
      setErreur("Les deux mots de passe ne correspondent pas.");
      return;
    }
    setEnCours(true);
    try {
      await api("/api/reinitialiser-mot-de-passe", {
        method: "POST",
        body: { identifiant, code, nouveau_mot_de_passe: nouveauMotDePasse },
      });
      setMessage("Mot de passe réinitialisé. Vous pouvez vous reconnecter.");
      setTimeout(onRetour, 1500);
    } catch (err) {
      setErreur(err.message);
    } finally {
      setEnCours(false);
    }
  };

  return (
    <form style={styles.carteConnexion} onSubmit={etape === "demande" ? demanderCode : reinitialiser}>
      <div style={styles.logoConnexion}>
        <img src="/logo.png" alt="H.S.E Motors" style={styles.logoImage} />
      </div>
      <p style={styles.sousTitreConnexion}>
        {etape === "demande" ? "Récupération du mot de passe admin" : "Entrez le code reçu par email"}
      </p>

      <label style={styles.champLabel}>
        Identifiant
        <input
          style={styles.input}
          value={identifiant}
          onChange={(e) => setIdentifiant(e.target.value)}
          placeholder="admin"
          disabled={etape === "saisie"}
        />
      </label>

      {etape === "saisie" && (
        <>
          <label style={styles.champLabel}>
            Code reçu par email
            <input
              style={styles.input}
              value={code}
              onChange={(e) => setCode(e.target.value)}
              placeholder="123456"
              autoFocus
            />
          </label>
          <label style={styles.champLabel}>
            Nouveau mot de passe
            <input
              style={styles.input}
              type="password"
              value={nouveauMotDePasse}
              onChange={(e) => setNouveauMotDePasse(e.target.value)}
              placeholder="••••••••"
            />
          </label>
          <label style={styles.champLabel}>
            Confirmer le mot de passe
            <input
              style={styles.input}
              type="password"
              value={confirmation}
              onChange={(e) => setConfirmation(e.target.value)}
              placeholder="••••••••"
            />
          </label>
        </>
      )}

      {message && <div style={styles.messageConnexion}>{message}</div>}
      {erreur && <div style={styles.erreurConnexion}>{erreur}</div>}

      <button style={{ ...styles.boutonConnexion, opacity: enCours ? 0.6 : 1 }} disabled={enCours} type="submit">
        {etape === "demande" ? (enCours ? "Envoi…" : "Envoyer le code") : (enCours ? "Réinitialisation…" : "Réinitialiser le mot de passe")}
      </button>

      <button type="button" style={styles.lienMotDePasseOublie} onClick={onRetour}>
        Retour à la connexion
      </button>
    </form>
  );
}

// ---------- Ticker ----------

function TickerBandeau({ entreprises, dossiers }) {
  const items = entreprises.map((ent) => {
    const total = dossiers.filter((d) => d.entreprise_id === ent.id).reduce((s, d) => s + d.mandat_total, 0);
    return { ...ent, total };
  });

  if (items.length === 0) return <div style={styles.ticker} />;

  return (
    <div style={styles.ticker}>
      <div style={styles.tickerContenu}>
        {items.map((it, i) => (
          <span key={i} style={styles.tickerItem}>
            <span style={{ ...styles.tickerPuce, background: it.couleur }} />
            {it.nom} <strong style={{ color: it.couleur, fontFamily: "'IBM Plex Mono', monospace" }}>{fmtEUR(it.total)}</strong>
          </span>
        ))}
      </div>
    </div>
  );
}

// ---------- En-tête ----------

function EnTete({ utilisateur, onDeconnexion }) {
  return (
    <header style={styles.enTete}>
      <div style={styles.enTeteGauche}>
        <img src="/logo-icon.png" alt="H.S.E Motors" style={styles.enTeteLogo} />
        <span style={styles.enTeteTitre}>H.S.E Motors</span>
      </div>
      <div style={styles.enTeteDroite}>
        <span style={styles.badgeRole}>
          {utilisateur.role === "admin" ? "Vue admin" : utilisateur.role === "animateur" ? "Vue animateur" : "Vue commercial"}
        </span>
        <span style={styles.nomUtilisateur}>{utilisateur.nom}</span>
        <button style={styles.boutonDeconnexion} onClick={onDeconnexion} title="Se déconnecter">
          <LogOut size={16} />
        </button>
      </div>
    </header>
  );
}

// ---------- Filtre entreprises ----------

function FiltreEntreprises({ entreprises, entrepriseFiltre, setEntrepriseFiltre }) {
  return (
    <div style={styles.filtreRangee}>
      <button
        style={{ ...styles.puceFiltre, ...(entrepriseFiltre === "toutes" ? styles.puceFiltreActive : {}) }}
        onClick={() => setEntrepriseFiltre("toutes")}
      >
        Toutes les entreprises
      </button>
      {entreprises.map((ent) => (
        <button
          key={ent.id}
          style={{
            ...styles.puceFiltre,
            ...(entrepriseFiltre === String(ent.id) || entrepriseFiltre === ent.id
              ? { ...styles.puceFiltreActive, borderColor: ent.couleur }
              : {}),
          }}
          onClick={() => setEntrepriseFiltre(ent.id)}
        >
          <span style={{ ...styles.puceCouleur, background: ent.couleur }} />
          {ent.nom}
        </button>
      ))}
    </div>
  );
}

// ---------- Filtre commercial ----------

function FiltreCommercial({ commerciaux, commercialFiltre, setCommercialFiltre }) {
  return (
    <div style={styles.filtreRangee}>
      <select
        style={styles.selectFiltre}
        value={commercialFiltre}
        onChange={(e) => setCommercialFiltre(e.target.value)}
      >
        <option value="tous">Tous les commerciaux</option>
        {commerciaux.map((c) => (
          <option key={c.id} value={String(c.id)}>{c.nom}</option>
        ))}
      </select>
    </div>
  );
}

// ---------- Filtre période (année / mois) ----------

const MOIS = [
  { valeur: "01", label: "Janvier" }, { valeur: "02", label: "Février" }, { valeur: "03", label: "Mars" },
  { valeur: "04", label: "Avril" }, { valeur: "05", label: "Mai" }, { valeur: "06", label: "Juin" },
  { valeur: "07", label: "Juillet" }, { valeur: "08", label: "Août" }, { valeur: "09", label: "Septembre" },
  { valeur: "10", label: "Octobre" }, { valeur: "11", label: "Novembre" }, { valeur: "12", label: "Décembre" },
];

function FiltrePeriode({ anneesDisponibles, anneeFiltre, setAnneeFiltre, moisFiltre, setMoisFiltre }) {
  return (
    <div style={styles.filtreRangee}>
      <select
        style={styles.selectFiltre}
        value={anneeFiltre}
        onChange={(e) => setAnneeFiltre(e.target.value)}
      >
        <option value="toutes">Toutes les années</option>
        {anneesDisponibles.map((a) => (
          <option key={a} value={a}>{a}</option>
        ))}
      </select>

      <select
        style={styles.selectFiltre}
        value={moisFiltre}
        onChange={(e) => setMoisFiltre(e.target.value)}
      >
        <option value="tous">Tous les mois</option>
        {MOIS.map((m) => (
          <option key={m.valeur} value={m.valeur}>{m.label}</option>
        ))}
      </select>
    </div>
  );
}

// ---------- KPI ----------

const GARANTIE_ACHAT_NON_VENDUE = [90.15, 86.15];

function KpiRangee({ dossiers, estAdmin, peutReorganiser, kpiOrder, onReorder }) {
  const chiffreAffairesHT = dossiers.reduce((s, d) => s + d.total_ht, 0);
  const caHtBrut = dossiers.reduce((s, d) => s + d.mandat_total / 1.2, 0);
  const totalCommissions = dossiers.reduce((s, d) => s + d.commission, 0);
  const caFraisIntermediation = dossiers.reduce((s, d) => s + d.frais_intermediation, 0);
  const voituresVendues = dossiers.length;

  // Véhicule non garantissable (garantie achat = 0€) : exclu uniquement du nombre
  // de garanties vendues et du taux de véhicule garantis.
  const garantiesVendues = dossiers.filter(
    (d) =>
      Math.abs(d.garantie_achat) > 0.001 &&
      !GARANTIE_ACHAT_NON_VENDUE.some((v) => Math.abs(d.garantie_achat - v) < 0.001)
  ).length;
  const tauxVehiculesGarantis = voituresVendues > 0 ? (garantiesVendues / voituresVendues) * 100 : 0;

  const achatGarantie = dossiers.reduce((s, d) => s + d.garantie_achat, 0);

  // Garantie vendu à 0€ : pas de garantie vendue sur ce dossier, on l'ignore.
  const caGarantieVendue = dossiers
    .filter((d) => Math.abs(d.garantie_prix_vendu) > 0.001)
    .reduce((s, d) => s + (d.garantie_prix_vendu - d.garantie_achat), 0);

  const mandatMoyen = voituresVendues > 0 ? chiffreAffairesHT / voituresVendues : 0;

  const kpisBase = [
    { id: "ca_ht_net", label: "CA HT net", valeur: fmtEUR(chiffreAffairesHT), icone: TrendingUp, couleur: "#E8A33D" },
    { id: "ca_ht_brut", label: "CA HT brut", valeur: fmtEUR(caHtBrut), icone: TrendingUp, couleur: "#5B8DEF" },
    { id: "garanties_vendues", label: "Nombre de garanties vendues", valeur: garantiesVendues, icone: ShieldCheck, couleur: "#C58AF0" },
    { id: "commissions_dues", label: "Commissions dues", valeur: fmtEUR(totalCommissions), icone: Users, couleur: "#4FD1C5" },
    { id: "voitures_vendues", label: "Voitures vendues", valeur: voituresVendues, icone: Car, couleur: "#8B93A1" },
    { id: "taux_garanti", label: "Taux de véhicule garantis", valeur: `${tauxVehiculesGarantis.toFixed(1)}%`, icone: ShieldCheck, couleur: "#4FD1C5" },
    { id: "ca_frais_intermediation", label: "CA frais d'intermédiation", valeur: fmtEUR(caFraisIntermediation), icone: TrendingUp, couleur: "#5B8DEF" },
    { id: "ca_garantie_vendue", label: "CA garantie vendue", valeur: fmtEUR(caGarantieVendue), icone: ShieldCheck, couleur: "#C58AF0" },
    { id: "mandat_moyen", label: "Mandat moyen", valeur: fmtEUR(mandatMoyen), icone: TrendingUp, couleur: "#E8A33D" },
    ...(estAdmin
      ? [{ id: "achat_garantie", label: "Achat garantie", valeur: fmtEUR(achatGarantie), icone: TrendingUp, couleur: "#8B93A1" }]
      : []),
  ];

  const ordreVoulu = kpiOrder && kpiOrder.length ? kpiOrder : kpisBase.map((k) => k.id);
  const parId = Object.fromEntries(kpisBase.map((k) => [k.id, k]));
  const kpis = [
    ...ordreVoulu.map((id) => parId[id]).filter(Boolean),
    ...kpisBase.filter((k) => !ordreVoulu.includes(k.id)),
  ];

  const [indexGlisse, setIndexGlisse] = useState(null);

  const deplacer = (indexSource, indexCible) => {
    if (indexSource === indexCible || Number.isNaN(indexSource)) return;
    const nouvelOrdre = kpis.map((k) => k.id);
    const [retire] = nouvelOrdre.splice(indexSource, 1);
    nouvelOrdre.splice(indexCible, 0, retire);
    onReorder && onReorder(nouvelOrdre);
  };

  return (
    <div style={styles.kpiRangee}>
      {kpis.map((k, index) => (
        <div
          key={k.id}
          style={{
            ...styles.kpiCarte,
            ...(peutReorganiser ? styles.kpiCarteDeplacable : {}),
            ...(indexGlisse === index ? styles.kpiCarteEnCoursDeplacement : {}),
          }}
          draggable={peutReorganiser}
          onDragStart={(e) => {
            e.dataTransfer.setData("text/plain", String(index));
            e.dataTransfer.effectAllowed = "move";
            setIndexGlisse(index);
          }}
          onDragOver={(e) => e.preventDefault()}
          onDrop={(e) => {
            e.preventDefault();
            deplacer(Number(e.dataTransfer.getData("text/plain")), index);
          }}
          onDragEnd={() => setIndexGlisse(null)}
        >
          <div style={{ ...styles.kpiIcone, background: `${k.couleur}22` }}>
            <k.icone size={18} color={k.couleur} strokeWidth={2} />
          </div>
          <div>
            <div style={styles.kpiValeur}>{k.valeur}</div>
            <div style={styles.kpiLabel}>{k.label}</div>
          </div>
        </div>
      ))}
    </div>
  );
}

  useEffect(() => {
    api("/api/animateurs").then(setAnimateurs).catch((e) => setErreur(e.message));
  }, []);

  return (
    <div>
      <div style={{ ...styles.sectionHeader, marginTop: 32 }}>
        <h2 style={styles.sectionTitre}>Comptes animateur (lecture seule)</h2>

      {modalOuverte && (
        <ModalAnimateur
          onFermer={() => setModalOuverte(false)}
          onValider={async (payload) => {
            try {
              const nouveau = await api("/api/animateurs", { method: "POST", body: payload });

        <div style={styles.modalEnTete}>
          <h3 style={styles.modalTitre}>{estEdition ? "Modifier l'entreprise" : "Nouvelle entreprise"}</h3>
          <button style={styles.modalFermer} onClick={onFermer}><X size={18} /></button>
        </div>

        <label style={styles.champLabel}>
          Nom
          <input style={styles.input} value={nom} onChange={(e) => setNom(e.target.value)} placeholder="Nom de l'entreprise" />
        </label>

        <label style={styles.champLabel}>
          Couleur d'identification
          <input style={{ ...styles.input, height: 40, padding: 4 }} type="color" value={couleur} onChange={(e) => setCouleur(e.target.value)} />
        </label>

        <button
          style={{ ...styles.boutonConnexion, opacity: valide ? 1 : 0.5, cursor: valide ? "pointer" : "not-allowed" }}
          disabled={!valide}
          onClick={() => valide && onValider({ id: entreprise.id, nom, couleur })}
        >
          {estEdition ? "Enregistrer les modifications" : "Créer l'entreprise"}
        </button>
      </div>
    </div>
  );
}
