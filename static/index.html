<script type="text/babel" data-type="module" data-presets="react">
import React, { useState, useEffect, useCallback } from "react";
import { createRoot } from "react-dom/client";
import { Car, TrendingUp, Users, LogOut, Plus, X, Pencil, Trash2, ShieldCheck, Search, RefreshCw, Target, Building2, Minimize2, Maximize2, Star, FileSpreadsheet, FileUp, Receipt, Wallet, PiggyBank } from "lucide-react";

// ---------- API ----------

async function api(path, options = {}) {
  const res = await fetch(path, {
    method: options.method || "GET",
    headers: options.body ? { "Content-Type": "application/json" } : undefined,
    body: options.body ? JSON.stringify(options.body) : undefined,
    credentials: "same-origin",
  });
  const isJson = res.headers.get("content-type")?.includes("application/json");
  const data = isJson ? await res.json() : null;
  if (!res.ok) {
    throw new Error((data && data.error) || `Erreur ${res.status}`);
  }
  return data;
}

const fmtEUR = (n) =>
  new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(n || 0);

// ---------- App ----------

export default function App() {
  const [chargement, setChargement] = useState(true);
  const [utilisateur, setUtilisateur] = useState(null);
  const [entreprises, setEntreprises] = useState([]);
  const [commerciaux, setCommerciaux] = useState([]);
  const [dossiers, setDossiers] = useState([]);
  const [dossiersTous, setDossiersTous] = useState([]);
  const [refacturation, setRefacturation] = useState(null);
  const [chargesFixes, setChargesFixes] = useState([]);
  const [entrepriseFiltre, setEntrepriseFiltre] = useState("toutes");
  const [commercialFiltre, setCommercialFiltre] = useState("tous");
  const [anneeFiltre, setAnneeFiltre] = useState("toutes");
  const [moisFiltre, setMoisFiltre] = useState("tous");
  const [rechercheTexte, setRechercheTexte] = useState("");
  const [vue, setVue] = useState("dossiers");
  const [modalDossier, setModalDossier] = useState(null); // null | {} | dossier existant
  const [modalCommercial, setModalCommercial] = useState(null);
  const [modalEntreprise, setModalEntreprise] = useState(null); // null | {} | entreprise existante
  const [erreur, setErreur] = useState("");
  const [kpiOrder, setKpiOrder] = useState(null);
  const [kpiReduits, setKpiReduits] = useState([]);
  const [actualisation, setActualisation] = useState(false);
  const [exportEnCours, setExportEnCours] = useState(false);

  const estAdmin = utilisateur?.role === "admin";
  const estAnimateur = utilisateur?.role === "animateur";
  const peutToutVoir = estAdmin || estAnimateur;

  useEffect(() => {
    setKpiOrder(utilisateur?.kpi_order || null);
    setKpiReduits(utilisateur?.kpi_reduits || []);
  }, [utilisateur?.id]);

  const reorganiserKpis = async (nouvelOrdre) => {
    setKpiOrder(nouvelOrdre);
    try {
      await api("/api/preferences/kpi-order", { method: "PUT", body: { order: nouvelOrdre } });
    } catch (e) {
      setErreur(e.message);
    }
  };

  const basculerReductionKpi = async (id) => {
    const nouveauxReduits = kpiReduits.includes(id)
      ? kpiReduits.filter((x) => x !== id)
      : [...kpiReduits, id];
    setKpiReduits(nouveauxReduits);
    try {
      await api("/api/preferences/kpi-reduits", { method: "PUT", body: { reduits: nouveauxReduits } });
    } catch (e) {
      setErreur(e.message);
    }
  };

  const exporterExcel = async (mode) => {
    setExportEnCours(true);
    setErreur("");
    try {
      const chemin = mode === "maj" ? "/api/export-excel/maj" : "/api/export-excel";
      const qs = entrepriseFiltre !== "toutes" ? `?entreprise_id=${entrepriseFiltre}` : "";
      const res = await fetch(`${chemin}${qs}`, { method: "POST", credentials: "same-origin" });
      if (!res.ok) {
        const data = await res.json().catch(() => null);
        throw new Error((data && data.error) || `Erreur ${res.status}`);
      }
      const blob = await res.blob();
      const entete = res.headers.get("content-disposition") || "";
      const correspondance = entete.match(/filename="?([^"]+)"?/);
      const nomFichier = correspondance ? correspondance[1] : "export-hse-motors.xlsx";
      const url = URL.createObjectURL(blob);
      const lien = document.createElement("a");
      lien.href = url;
      lien.download = nomFichier;
      document.body.appendChild(lien);
      lien.click();
      lien.remove();
      URL.revokeObjectURL(url);
    } catch (e) {
      setErreur(e.message);
    } finally {
      setExportEnCours(false);
    }
  };

  const chargerReferentiels = useCallback(async () => {
    const [ent, com] = await Promise.all([api("/api/entreprises"), api("/api/commerciaux")]);
    setEntreprises(ent);
    setCommerciaux(com);
  }, []);

  const chargerDossiers = useCallback(async (filtre) => {
    const qs = filtre && filtre !== "toutes" ? `?entreprise_id=${filtre}` : "";
    const rows = await api(`/api/dossiers${qs}`);
    setDossiers(rows);
  }, []);

  const chargerDossiersTous = useCallback(async () => {
    const rows = await api("/api/dossiers");
    setDossiersTous(rows);
  }, []);

  const chargerRefacturation = useCallback(async () => {
    const data = await api("/api/refacturation");
    setRefacturation(data);
  }, []);

  const chargerChargesFixes = useCallback(async () => {
    const rows = await api("/api/charges-fixes");
    setChargesFixes(rows);
  }, []);

  useEffect(() => {
    (async () => {
      try {
        const me = await api("/api/me");
        setUtilisateur(me);
        const chargeurs = [chargerReferentiels(), chargerDossiers("toutes"), chargerDossiersTous(), chargerRefacturation()];
        if (me.role === "admin") chargeurs.push(chargerChargesFixes());
        await Promise.all(chargeurs);
      } catch {
        setUtilisateur(null);
      } finally {
        setChargement(false);
      }
    })();
  }, [chargerReferentiels, chargerDossiers, chargerDossiersTous, chargerRefacturation, chargerChargesFixes]);

  useEffect(() => {
    if (utilisateur) chargerDossiers(entrepriseFiltre);
  }, [entrepriseFiltre, utilisateur, chargerDossiers]);

  const handleConnexion = async (me) => {
    setUtilisateur(me);
    setChargement(true);
    try {
      const chargeurs = [chargerReferentiels(), chargerDossiers("toutes"), chargerDossiersTous(), chargerRefacturation()];
      if (me.role === "admin") chargeurs.push(chargerChargesFixes());
      await Promise.all(chargeurs);
    } finally {
      setChargement(false);
    }
  };

  const handleDeconnexion = async () => {
    await api("/api/logout", { method: "POST" });
    setUtilisateur(null);
    setEntreprises([]);
    setCommerciaux([]);
    setDossiers([]);
    setDossiersTous([]);
    setRefacturation(null);
    setChargesFixes([]);
    setVue("dossiers");
  };

  const rafraichir = async () => {
    const chargeurs = [chargerReferentiels(), chargerDossiers(entrepriseFiltre), chargerDossiersTous(), chargerRefacturation()];
    if (estAdmin) chargeurs.push(chargerChargesFixes());
    await Promise.all(chargeurs);
  };

  const actualiserManuellement = async () => {
    setActualisation(true);
    try {
      await rafraichir();
    } catch (e) {
      setErreur(e.message);
    } finally {
      setActualisation(false);
    }
  };

  if (chargement) {
    return <div style={styles.pageChargement}>Chargement…</div>;
  }

  if (!utilisateur) {
    return <EcranConnexion onConnexion={handleConnexion} />;
  }

  const anneesDisponibles = [...new Set(dossiersTous.map((d) => d.date.slice(0, 4)))].sort((a, b) => b.localeCompare(a));

  const rechercheNormalisee = rechercheTexte.trim().toLowerCase();

  const dossiersAffiches = dossiers.filter((d) => {
    if (commercialFiltre !== "tous" && String(d.commercial_id) !== commercialFiltre) return false;
    if (anneeFiltre !== "toutes" && d.date.slice(0, 4) !== anneeFiltre) return false;
    if (moisFiltre !== "tous" && d.date.slice(5, 7) !== moisFiltre) return false;
    if (rechercheNormalisee) {
      const dansTexte = (valeur) => (valeur || "").toLowerCase().includes(rechercheNormalisee);
      if (!dansTexte(d.client) && !dansTexte(d.voiture) && !dansTexte(d.plaque)) return false;
    }
    return true;
  });

  // Même logique de filtre entreprise/commercial que dossiersAffiches, appliquée aux
  // lignes de refacturation (mois courant uniquement, pas de filtre année/mois : ça n'a
  // pas de sens sur une donnée qui ne couvre que le mois en cours).
  const refacturationTotal = (refacturation?.lignes || [])
    .filter((l) => {
      if (commercialFiltre !== "tous" && String(l.commercial_id) !== commercialFiltre) return false;
      if (entrepriseFiltre !== "toutes") {
        const com = commerciaux.find((c) => c.id === l.commercial_id);
        if (!com || String(com.entreprise_id) !== String(entrepriseFiltre)) return false;
      }
      return true;
    })
    .reduce((s, l) => s + l.total, 0);

  // Charges fixes : pas de notion d'entreprise ni de commercial, ni de mois — une somme
  // globale unique, valable pour l'ensemble tant qu'un poste n'est pas modifié/supprimé.
  const chargesFixesTotal = chargesFixes.reduce((s, c) => s + c.montant, 0);

  // Le KPI d'atteinte d'objectif n'a de sens que pour un seul commercial à la fois :
  // soit c'est le compte connecté, soit l'admin/animateur a filtré sur une personne précise.
  let commercialCible = null;
  if (utilisateur.role === "commercial") {
    commercialCible = commerciaux.find((c) => c.id === utilisateur.commercial_id) || null;
  } else if (peutToutVoir && commercialFiltre !== "tous") {
    commercialCible = commerciaux.find((c) => String(c.id) === commercialFiltre) || null;
  }

  // Objectif par entreprise : réservé à l'admin, uniquement quand une seule
  // entreprise est sélectionnée dans le filtre.
  const entrepriseCible =
    estAdmin && entrepriseFiltre !== "toutes"
      ? entreprises.find((e) => String(e.id) === String(entrepriseFiltre)) || null
      : null;

  // Objectif global : somme des objectifs (et des réalisés du mois) de toutes les
  // entreprises qui en ont un défini — uniquement sur "Toutes les entreprises".
  const entreprisesAvecObjectif = entreprises.filter((e) => e.objectif_ca_ht_brut != null);
  const objectifGlobalEntreprises =
    estAdmin && entrepriseFiltre === "toutes" && entreprisesAvecObjectif.length > 0
      ? {
          objectif: entreprisesAvecObjectif.reduce((s, e) => s + e.objectif_ca_ht_brut, 0),
          reel: entreprisesAvecObjectif.reduce((s, e) => s + e.ca_ht_brut_mois_courant, 0),
        }
      : null;

  return (
    <div style={styles.page}>
      <TickerBandeau entreprises={entreprises} dossiers={dossiersTous} />
      <EnTete
        utilisateur={utilisateur}
        onDeconnexion={handleDeconnexion}
        onActualiser={actualiserManuellement}
        actualisation={actualisation}
      />

      <div style={styles.corps}>
        {erreur && (
          <div style={styles.bandeauErreur}>
            {erreur}
            <button style={styles.fermerErreur} onClick={() => setErreur("")}><X size={14} /></button>
          </div>
        )}

        <div style={styles.ongletsRangee}>
          <button
            style={{ ...styles.onglet, ...(vue === "dossiers" ? styles.ongletActif : {}) }}
            onClick={() => setVue("dossiers")}
          >
            Dossiers
          </button>
          <button
            style={{ ...styles.onglet, ...(vue === "refacturation" ? styles.ongletActif : {}) }}
            onClick={() => setVue("refacturation")}
          >
            Refacturation
          </button>
          {peutToutVoir && (
            <button
              style={{ ...styles.onglet, ...(vue === "equipe" ? styles.ongletActif : {}) }}
              onClick={() => setVue("equipe")}
            >
              Équipe &amp; entreprises
            </button>
          )}
          {estAdmin && (
            <button
              style={{ ...styles.onglet, ...(vue === "charges" ? styles.ongletActif : {}) }}
              onClick={() => setVue("charges")}
            >
              Charges fixes
            </button>
          )}
        </div>

        {vue === "dossiers" && (
          <>
            {peutToutVoir && (
              <FiltreEntreprises
                entreprises={entreprises}
                entrepriseFiltre={entrepriseFiltre}
                setEntrepriseFiltre={setEntrepriseFiltre}
              />
            )}

            {peutToutVoir && (
              <FiltreCommercial
                commerciaux={commerciaux}
                commercialFiltre={commercialFiltre}
                setCommercialFiltre={setCommercialFiltre}
              />
            )}

            <FiltrePeriode
              anneesDisponibles={anneesDisponibles}
              anneeFiltre={anneeFiltre}
              setAnneeFiltre={setAnneeFiltre}
              moisFiltre={moisFiltre}
              setMoisFiltre={setMoisFiltre}
            />

            <KpiRangee
              dossiers={dossiersAffiches}
              estAdmin={peutToutVoir}
              peutReorganiser={true}
              kpiOrder={kpiOrder}
              onReorder={reorganiserKpis}
              commercialCible={commercialCible}
              entrepriseCible={entrepriseCible}
              objectifGlobalEntreprises={objectifGlobalEntreprises}
              refacturationTotal={refacturationTotal}
              estAdminStrict={estAdmin}
              chargesFixesTotal={chargesFixesTotal}
              kpiReduits={kpiReduits}
              onBasculerReduction={basculerReductionKpi}
            />

            <div style={styles.sectionHeader}>
              <h2 style={styles.sectionTitre}>Dossiers</h2>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                {estAdmin && (
                  <>
                    <button
                      style={{ ...styles.boutonSecondaire, opacity: exportEnCours ? 0.6 : 1 }}
                      disabled={exportEnCours}
                      title="Génère un nouveau fichier Excel avec tous les dossiers, une feuille par commercial"
                      onClick={() => exporterExcel("complet")}
                    >
                      <FileSpreadsheet size={16} /> Exporter Excel
                    </button>
                    <button
                      style={{ ...styles.boutonSecondaire, opacity: exportEnCours ? 0.6 : 1 }}
                      disabled={exportEnCours}
                      title="Génère un fichier Excel avec uniquement les dossiers créés depuis le dernier export"
                      onClick={() => exporterExcel("maj")}
                    >
                      <FileUp size={16} /> Mettre à jour Excel
                    </button>
                  </>
                )}
                {!estAnimateur && (
                  <button style={styles.boutonAjout} onClick={() => setModalDossier({})}>
                    <Plus size={16} strokeWidth={2.5} /> Nouveau dossier
                  </button>
                )}
              </div>
            </div>

            <div style={styles.rechercheConteneur}>
              <Search size={15} color="#8B93A1" />
              <input
                style={styles.rechercheInput}
                value={rechercheTexte}
                onChange={(e) => setRechercheTexte(e.target.value)}
                placeholder="Rechercher par client, véhicule ou plaque…"
              />
              {rechercheTexte && (
                <button style={styles.rechercheEffacer} onClick={() => setRechercheTexte("")} title="Effacer">
                  <X size={14} />
                </button>
              )}
            </div>

            <TableauVentes
              dossiers={dossiersAffiches}
              estAdmin={peutToutVoir}
              peutModifier={!estAnimateur}
              onModifier={(d) => setModalDossier(d)}
              onSupprimer={async (d) => {
                if (!confirm(`Supprimer le dossier de ${d.client} ?`)) return;
                try {
                  await api(`/api/dossiers/${d.id}`, { method: "DELETE" });
                  await rafraichir();
                } catch (e) {
                  setErreur(e.message);
                }
              }}
            />
          </>
        )}

        {vue === "refacturation" && (
          <Refacturation
            estAdmin={estAdmin}
            estAnimateur={estAnimateur}
            donnees={refacturation}
            onRafraichir={chargerRefacturation}
          />
        )}

        {vue === "equipe" && peutToutVoir && (
          <EquipeEtEntreprises
            entreprises={entreprises}
            commerciaux={commerciaux}
            estAdmin={estAdmin}
            onNouvelleEntreprise={() => setModalEntreprise({})}
            onModifierEntreprise={(e) => setModalEntreprise(e)}
            onNouveauCommercial={() => setModalCommercial({})}
            onModifierCommercial={(c) => setModalCommercial(c)}
          />
        )}

        {vue === "charges" && estAdmin && (
          <ChargesFixes donnees={chargesFixes} onRafraichir={chargerChargesFixes} onErreur={setErreur} />
        )}
      </div>

      {modalDossier && (
        <ModalDossier
          dossier={modalDossier}
          estAdmin={estAdmin}
          commerciaux={commerciaux}
          utilisateur={utilisateur}
          onFermer={() => setModalDossier(null)}
          onValider={async (payload) => {
            try {
              if (payload.id) {
                await api(`/api/dossiers/${payload.id}`, { method: "PUT", body: payload });
              } else {
                await api("/api/dossiers", { method: "POST", body: payload });
              }
              setModalDossier(null);
              await rafraichir();
            } catch (e) {
              setErreur(e.message);
            }
          }}
        />
      )}

      {modalCommercial && (
        <ModalCommercial
          commercial={modalCommercial}
          entreprises={entreprises}
          onFermer={() => setModalCommercial(null)}
          onValider={async (payload) => {
            try {
              if (payload.id) {
                await api(`/api/commerciaux/${payload.id}`, { method: "PUT", body: payload });
              } else {
                await api("/api/commerciaux", { method: "POST", body: payload });
              }
              setModalCommercial(null);
              await rafraichir();
            } catch (e) {
              setErreur(e.message);
            }
          }}
        />
      )}

      {modalEntreprise && (
        <ModalEntreprise
          entreprise={modalEntreprise}
          onFermer={() => setModalEntreprise(null)}
          onValider={async (payload) => {
            try {
              if (payload.id) {
                await api(`/api/entreprises/${payload.id}`, { method: "PUT", body: payload });
              } else {
                await api("/api/entreprises", { method: "POST", body: payload });
              }
              setModalEntreprise(null);
              await rafraichir();
            } catch (e) {
              setErreur(e.message);
            }
          }}
        />
      )}
    </div>
  );
}

// ---------- Écran de connexion ----------

function EcranConnexion({ onConnexion }) {
  const [mode, setMode] = useState("connexion"); // connexion | recuperation
  const [identifiant, setIdentifiant] = useState("");
  const [motDePasse, setMotDePasse] = useState("");
  const [erreur, setErreur] = useState("");
  const [enCours, setEnCours] = useState(false);

  const connecter = async (e) => {
    e.preventDefault();
    setErreur("");
    setEnCours(true);
    try {
      const me = await api("/api/login", { method: "POST", body: { identifiant, mot_de_passe: motDePasse } });
      onConnexion(me);
    } catch (err) {
      setErreur(err.message);
    } finally {
      setEnCours(false);
    }
  };

  return (
    <div style={styles.pageConnexion}>
      {mode === "connexion" ? (
        <form style={styles.carteConnexion} onSubmit={connecter}>
          <div style={styles.logoConnexion}>
            <img src="/logo.png" alt="H.S.E Motors" style={styles.logoImage} />
          </div>
          <p style={styles.sousTitreConnexion}>Connectez-vous à votre espace</p>

          <label style={styles.champLabel}>
            Identifiant
            <input
              style={styles.input}
              value={identifiant}
              onChange={(e) => setIdentifiant(e.target.value)}
              placeholder="ex: admin"
              autoFocus
            />
          </label>

          <label style={styles.champLabel}>
            Mot de passe
            <input
              style={styles.input}
              type="password"
              value={motDePasse}
              onChange={(e) => setMotDePasse(e.target.value)}
              placeholder="••••••••"
            />
          </label>

          {erreur && <div style={styles.erreurConnexion}>{erreur}</div>}

          <button style={{ ...styles.boutonConnexion, opacity: enCours ? 0.6 : 1 }} disabled={enCours} type="submit">
            {enCours ? "Connexion…" : "Entrer"}
          </button>

          <button
            type="button"
            style={styles.lienMotDePasseOublie}
            onClick={() => { setMode("recuperation"); setErreur(""); }}
          >
            Mot de passe oublié ?
          </button>
        </form>
      ) : (
        <RecuperationMotDePasse onRetour={() => setMode("connexion")} />
      )}
    </div>
  );
}

// ---------- Récupération mot de passe admin ----------

function RecuperationMotDePasse({ onRetour }) {
  const [etape, setEtape] = useState("demande"); // demande | saisie
  const [identifiant, setIdentifiant] = useState("admin");
  const [code, setCode] = useState("");
  const [nouveauMotDePasse, setNouveauMotDePasse] = useState("");
  const [confirmation, setConfirmation] = useState("");
  const [erreur, setErreur] = useState("");
  const [message, setMessage] = useState("");
  const [enCours, setEnCours] = useState(false);

  const demanderCode = async (e) => {
    e.preventDefault();
    setErreur("");
    setEnCours(true);
    try {
      const res = await api("/api/mot-de-passe-oublie", { method: "POST", body: { identifiant } });
      setMessage(res.message);
      setEtape("saisie");
    } catch (err) {
      setErreur(err.message);
    } finally {
      setEnCours(false);
    }
  };

  const reinitialiser = async (e) => {
    e.preventDefault();
    setErreur("");
    if (nouveauMotDePasse !== confirmation) {
      setErreur("Les deux mots de passe ne correspondent pas.");
      return;
    }
    setEnCours(true);
    try {
      await api("/api/reinitialiser-mot-de-passe", {
        method: "POST",
        body: { identifiant, code, nouveau_mot_de_passe: nouveauMotDePasse },
      });
      setMessage("Mot de passe réinitialisé. Vous pouvez vous reconnecter.");
      setTimeout(onRetour, 1500);
    } catch (err) {
      setErreur(err.message);
    } finally {
      setEnCours(false);
    }
  };

  return (
    <form style={styles.carteConnexion} onSubmit={etape === "demande" ? demanderCode : reinitialiser}>
      <div style={styles.logoConnexion}>
        <img src="/logo.png" alt="H.S.E Motors" style={styles.logoImage} />
      </div>
      <p style={styles.sousTitreConnexion}>
        {etape === "demande" ? "Récupération du mot de passe admin" : "Entrez le code reçu par email"}
      </p>

      <label style={styles.champLabel}>
        Identifiant
        <input
          style={styles.input}
          value={identifiant}
          onChange={(e) => setIdentifiant(e.target.value)}
          placeholder="admin"
          disabled={etape === "saisie"}
        />
      </label>

      {etape === "saisie" && (
        <>
          <label style={styles.champLabel}>
            Code reçu par email
            <input
              style={styles.input}
              value={code}
              onChange={(e) => setCode(e.target.value)}
              placeholder="123456"
              autoFocus
            />
          </label>
          <label style={styles.champLabel}>
            Nouveau mot de passe
            <input
              style={styles.input}
              type="password"
              value={nouveauMotDePasse}
              onChange={(e) => setNouveauMotDePasse(e.target.value)}
              placeholder="••••••••"
            />
          </label>
          <label style={styles.champLabel}>
            Confirmer le mot de passe
            <input
              style={styles.input}
              type="password"
              value={confirmation}
              onChange={(e) => setConfirmation(e.target.value)}
              placeholder="••••••••"
            />
          </label>
        </>
      )}

      {message && <div style={styles.messageConnexion}>{message}</div>}
      {erreur && <div style={styles.erreurConnexion}>{erreur}</div>}

      <button style={{ ...styles.boutonConnexion, opacity: enCours ? 0.6 : 1 }} disabled={enCours} type="submit">
        {etape === "demande" ? (enCours ? "Envoi…" : "Envoyer le code") : (enCours ? "Réinitialisation…" : "Réinitialiser le mot de passe")}
      </button>

      <button type="button" style={styles.lienMotDePasseOublie} onClick={onRetour}>
        Retour à la connexion
      </button>
    </form>
  );
}

// ---------- KPI ----------

const GARANTIE_ACHAT_NON_VENDUE = [90.15, 86.15];

function KpiRangee({ dossiers, estAdmin, peutReorganiser, kpiOrder, onReorder, commercialCible, entrepriseCible, objectifGlobalEntreprises, refacturationTotal, estAdminStrict, chargesFixesTotal, kpiReduits, onBasculerReduction }) {
  const chiffreAffairesHT = dossiers.reduce((s, d) => s + d.total_ht, 0);
  const caTtc = dossiers.reduce((s, d) => s + d.mandat_total, 0);
  const caHtBrut = dossiers.reduce((s, d) => s + d.mandat_total / 1.2, 0);
  // Le montant refacturé (Call center + Leads Meta + Leboncoin du mois courant) vient en
  // déduction des commissions dues aux commerciaux.
  const totalCommissions = dossiers.reduce((s, d) => s + d.commission, 0) - (refacturationTotal || 0);
  const caFraisIntermediation = dossiers.reduce((s, d) => s + d.frais_intermediation, 0);
  const voituresVendues = dossiers.length;

  // Véhicule non garantissable (garantie achat = 0€) : exclu uniquement du nombre
  // de garanties vendues et du taux de véhicule garantis.
  const garantiesVendues = dossiers.filter(
    (d) =>
      Math.abs(d.garantie_achat) > 0.001 &&
      !GARANTIE_ACHAT_NON_VENDUE.some((v) => Math.abs(d.garantie_achat - v) < 0.001)
  ).length;
  const tauxVehiculesGarantis = voituresVendues > 0 ? (garantiesVendues / voituresVendues) * 100 : 0;

  const achatGarantie = dossiers.reduce((s, d) => s + d.garantie_achat, 0);

  // Garantie vendu à 0€ : pas de garantie vendue sur ce dossier, on l'ignore.
  const caGarantieVendue = dossiers
    .filter((d) => Math.abs(d.garantie_prix_vendu) > 0.001)
    .reduce((s, d) => s + (d.garantie_prix_vendu - d.garantie_achat), 0);

  const mandatMoyen = voituresVendues > 0 ? chiffreAffairesHT / voituresVendues : 0;

  const kpisBase = [
    { id: "ca_ht_net", label: "CA HT net", valeur: fmtEUR(chiffreAffairesHT), icone: TrendingUp, couleur: "#E8A33D" },
    { id: "ca_ht_brut", label: "CA HT brut", valeur: fmtEUR(caHtBrut), icone: TrendingUp, couleur: "#5B8DEF" },
    { id: "ca_ttc", label: "CA TTC", valeur: fmtEUR(caTtc), icone: TrendingUp, couleur: "#4FD1C5" },
    { id: "garanties_vendues", label: "Nombre de garanties vendues", valeur: garantiesVendues, icone: ShieldCheck, couleur: "#C58AF0" },
    { id: "commissions_dues", label: "Commissions dues", valeur: fmtEUR(totalCommissions), icone: Users, couleur: "#4FD1C5" },
    { id: "voitures_vendues", label: "Voitures vendues", valeur: voituresVendues, icone: Car, couleur: "#8B93A1" },
    { id: "taux_garanti", label: "Taux de véhicule garantis", valeur: `${tauxVehiculesGarantis.toFixed(1)}%`, icone: ShieldCheck, couleur: "#4FD1C5" },
    { id: "ca_frais_intermediation", label: "CA frais d'intermédiation", valeur: fmtEUR(caFraisIntermediation), icone: TrendingUp, couleur: "#5B8DEF" },
    { id: "ca_garantie_vendue", label: "CA garantie vendue", valeur: fmtEUR(caGarantieVendue), icone: ShieldCheck, couleur: "#C58AF0" },
    { id: "mandat_moyen", label: "Mandat moyen", valeur: fmtEUR(mandatMoyen), icone: TrendingUp, couleur: "#E8A33D" },
    { id: "refacturation", label: "Refacturation", valeur: fmtEUR(refacturationTotal || 0), icone: Receipt, couleur: "#C58AF0" },
    ...(estAdmin
      ? [{ id: "achat_garantie", label: "Achat garantie", valeur: fmtEUR(achatGarantie), icone: TrendingUp, couleur: "#8B93A1" }]
      : []),
    ...(estAdminStrict
      ? [{ id: "charges_fixes", label: "Charges fixes", valeur: fmtEUR(chargesFixesTotal || 0), icone: Wallet, couleur: "#E8746B" }]
      : []),
    ...(estAdminStrict
      ? [{
          id: "benefice",
          label: "Bénéfice",
          valeur: fmtEUR(chiffreAffairesHT - totalCommissions - (chargesFixesTotal || 0)),
          icone: PiggyBank,
          couleur: "#4FD1C5",
        }]
      : []),
    ...(commercialCible && commercialCible.objectif_ca_ht_brut != null
      ? [{
          id: "objectif_atteinte",
          label: `Objectif du mois (${fmtEUR(commercialCible.objectif_ca_ht_brut)})`,
          valeur: `${commercialCible.pourcentage_atteinte.toFixed(0)}%`,
          icone: Target,
          couleur:
            commercialCible.pourcentage_atteinte >= 100 ? "#4FD1C5"
            : commercialCible.pourcentage_atteinte >= 50 ? "#E8A33D"
            : "#E8746B",
        }]
      : []),
    ...(commercialCible
      ? [{
          id: "bonus_avis_google",
          label: commercialCible.bonus_avis_actif
            ? `Bonus avis Google obtenu (${commercialCible.avis_obtenus_mois_courant}/${commercialCible.objectif_avis_mois_courant} avis)`
            : `Bonus avis Google si atteint (${commercialCible.avis_obtenus_mois_courant}/${commercialCible.objectif_avis_mois_courant} avis)`,
          valeur: fmtEUR(chiffreAffairesHT * 0.05),
          icone: Star,
          couleur: commercialCible.bonus_avis_actif ? "#4FD1C5" : "#8B93A1",
        }]
      : []),
    ...(entrepriseCible && entrepriseCible.objectif_ca_ht_brut != null
      ? [{
          id: "objectif_entreprise_atteinte",
          label: `Objectif entreprise du mois (${fmtEUR(entrepriseCible.objectif_ca_ht_brut)})`,
          valeur: `${entrepriseCible.pourcentage_atteinte.toFixed(0)}%`,
          icone: Building2,
          couleur:
            entrepriseCible.pourcentage_atteinte >= 100 ? "#4FD1C5"
            : entrepriseCible.pourcentage_atteinte >= 50 ? "#E8A33D"
            : "#E8746B",
        }]
      : []),
    ...(objectifGlobalEntreprises
      ? (() => {
          const pct = (objectifGlobalEntreprises.reel / objectifGlobalEntreprises.objectif) * 100;
          return [{
            id: "objectif_global_entreprises",
            label: `Objectif global du mois (${fmtEUR(objectifGlobalEntreprises.objectif)})`,
            valeur: `${pct.toFixed(0)}%`,
            icone: Building2,
            couleur: pct >= 100 ? "#4FD1C5" : pct >= 50 ? "#E8A33D" : "#E8746B",
          }];
        })()
      : []),
  ];

  const ordreVoulu = kpiOrder && kpiOrder.length ? kpiOrder : kpisBase.map((k) => k.id);
  const parId = Object.fromEntries(kpisBase.map((k) => [k.id, k]));
  const kpis = [
    ...ordreVoulu.map((id) => parId[id]).filter(Boolean),
    ...kpisBase.filter((k) => !ordreVoulu.includes(k.id)),
  ];

  const [indexGlisse, setIndexGlisse] = useState(null);

  const deplacer = (indexSource, indexCible) => {
    if (indexSource === indexCible || Number.isNaN(indexSource)) return;
    const nouvelOrdre = kpis.map((k) => k.id);
    const [retire] = nouvelOrdre.splice(indexSource, 1);
    nouvelOrdre.splice(indexCible, 0, retire);
    onReorder && onReorder(nouvelOrdre);
  };

  return (
    <div style={styles.kpiRangee}>
      {kpis.map((k, index) => {
        const estReduit = (kpiReduits || []).includes(k.id);
        return (
          <div
            key={k.id}
            style={{
              ...styles.kpiCarte,
              ...(estReduit ? styles.kpiCarteReduite : {}),
              ...(peutReorganiser ? styles.kpiCarteDeplacable : {}),
              ...(indexGlisse === index ? styles.kpiCarteEnCoursDeplacement : {}),
            }}
            draggable={peutReorganiser}
            onDragStart={(e) => {
              e.dataTransfer.setData("text/plain", String(index));
              e.dataTransfer.effectAllowed = "move";
              setIndexGlisse(index);
            }}
            onDragOver={(e) => e.preventDefault()}
            onDrop={(e) => {
              e.preventDefault();
              deplacer(Number(e.dataTransfer.getData("text/plain")), index);
            }}
            onDragEnd={() => setIndexGlisse(null)}
          >
            <div style={{ ...styles.kpiIcone, background: `${k.couleur}22`, ...(estReduit ? styles.kpiIconeReduite : {}) }}>
              <k.icone size={estReduit ? 15 : 18} color={k.couleur} strokeWidth={2} />
            </div>
            {!estReduit && (
              <div>
                <div style={styles.kpiValeur}>{k.valeur}</div>
                <div style={styles.kpiLabel}>{k.label}</div>
              </div>
            )}
            {estReduit && <div style={styles.kpiValeurReduite}>{k.valeur}</div>}
            {onBasculerReduction && (
              <button
                type="button"
                title={estReduit ? "Agrandir ce KPI" : "Réduire ce KPI"}
                style={{ ...styles.kpiBoutonReduire, ...(estReduit ? styles.kpiBoutonReduireCompact : {}) }}
                onMouseDown={(e) => e.stopPropagation()}
                onClick={(e) => {
                  e.stopPropagation();
                  onBasculerReduction(k.id);
                }}
              >
                {estReduit ? <Maximize2 size={12} /> : <Minimize2 size={12} />}
              </button>
            )}
          </div>
        );
      })}
    </div>
  );
}

function useColonnesFigees() {
  // Les colonnes figées (position: sticky) entrent en conflit avec le geste de
  // défilement tactile sur petit écran (bug WebKit connu sur iOS Safari en portrait).
  // On les désactive en dessous de 640px : le tableau reste défilable normalement.
  const [actives, setActives] = useState(
    typeof window !== "undefined" ? window.innerWidth >= 640 : true
  );
  useEffect(() => {
    const maj = () => setActives(window.innerWidth >= 640);
    window.addEventListener("resize", maj);
    return () => window.removeEventListener("resize", maj);
  }, []);
  return actives;
}

function ModalDossier({ dossier, estAdmin, commerciaux, utilisateur, onFermer, onValider }) {
  const estEdition = Boolean(dossier.id);
  const [commercialId, setCommercialId] = useState(
    dossier.commercial_id || (estAdmin ? commerciaux[0]?.id : utilisateur.commercial_id)
  );
  const [client, setClient] = useState(dossier.client || "");
  const [voiture, setVoiture] = useState(dossier.voiture || "");
  const [plaque, setPlaque] = useState(dossier.plaque || "");
  const [garantieAchat, setGarantieAchat] = useState(dossier.garantie_achat ?? "");
  const [garantiePrixVendu, setGarantiePrixVendu] = useState(dossier.garantie_prix_vendu ?? "");
  const [fraisIntermediation, setFraisIntermediation] = useState(dossier.frais_intermediation ?? "");
  const [nettoyage, setNettoyage] = useState(dossier.nettoyage ?? "");
  const [commissionAgence, setCommissionAgence] = useState(dossier.commission_agence ?? "");
  const [achatLivraison, setAchatLivraison] = useState(dossier.achat_livraison ?? "");
  const [venteLivraison, setVenteLivraison] = useState(dossier.vente_livraison ?? "");
  const [date, setDate] = useState(dossier.date || new Date().toISOString().slice(0, 10));

  // Mandat total n'est plus saisi : il se déduit de ces montants.
  const mandatTotal =
    (Number(commissionAgence) || 0) +
    (Number(fraisIntermediation) || 0) +
    (Number(garantiePrixVendu) || 0) +
    (Number(venteLivraison) || 0);

  const valide = client.trim() !== "" && voiture.trim() !== "" && mandatTotal > 0;

  return (
    <div style={styles.modalFond} onClick={onFermer}>
      <div style={styles.modalCarte} onClick={(e) => e.stopPropagation()}>
        <div style={styles.modalEnTete}>
          <h3 style={styles.modalTitre}>{estEdition ? "Modifier le dossier" : "Nouveau dossier"}</h3>
          <button style={styles.modalFermer} onClick={onFermer}>
            <X size={18} />
          </button>
        </div>

        {estAdmin && (
          <label style={styles.champLabel}>
            Commercial
            <select value={commercialId} onChange={(e) => setCommercialId(Number(e.target.value))} style={styles.select}>
              {commerciaux.map((c) => (
                <option key={c.id} value={c.id}>{c.nom}</option>
              ))}
            </select>
          </label>
        )}

        <label style={styles.champLabel}>
          Date
          <input style={styles.input} type="date" value={date} onChange={(e) => setDate(e.target.value)} />
        </label>

        <label style={styles.champLabel}>
          Client
          <input style={styles.input} value={client} onChange={(e) => setClient(e.target.value)} placeholder="Nom du client" />
        </label>

        <label style={styles.champLabel}>
          Voiture
          <input style={styles.input} value={voiture} onChange={(e) => setVoiture(e.target.value)} placeholder="Ex: Peugeot 3008" />
        </label>

        <label style={styles.champLabel}>
          Plaque d'immatriculation
          <input
            style={styles.input}
            value={plaque}
            onChange={(e) => setPlaque(e.target.value.toUpperCase())}
            placeholder="AA-123-BB"
          />
        </label>

        <label style={styles.champLabel}>
          Frais d'intermédiation (€)
          <input
            style={styles.input}
            type="number"
            value={fraisIntermediation}
            onChange={(e) => setFraisIntermediation(e.target.value)}
            placeholder="0"
          />
        </label>

        <label style={styles.champLabel}>
          Commission d'agence (€)
          <input
            style={styles.input}
            type="number"
            value={commissionAgence}
            onChange={(e) => setCommissionAgence(e.target.value)}
            placeholder="0"
          />
        </label>

        <label style={styles.champLabel}>
          Garantie prix vendu (€)
          <input style={styles.input} type="number" value={garantiePrixVendu} onChange={(e) => setGarantiePrixVendu(e.target.value)} placeholder="0" />
        </label>

        <label style={styles.champLabel}>
          Garantie achat (€)
          <input style={styles.input} type="number" value={garantieAchat} onChange={(e) => setGarantieAchat(e.target.value)} placeholder="0" />
        </label>

        <div style={styles.tcaApercu}>
          <span>TCA (18%)</span>
          <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#C58AF0", fontWeight: 600 }}>
            {fmtEUR(Math.max(0, (Number(garantiePrixVendu) || 0) - (Number(garantieAchat) || 0)) * 0.18)}
          </span>
        </div>

        <label style={styles.champLabel}>
          Achat livraison (€)
          <input
            style={styles.input}
            type="number"
            value={achatLivraison}
            onChange={(e) => setAchatLivraison(e.target.value)}
            placeholder="0"
          />
        </label>
        <div style={styles.tauxAutoAide}>À compléter en cas de besoin — déduit du total HT</div>

        <label style={styles.champLabel}>
          Vente livraison (€)
          <input
            style={styles.input}
            type="number"
            value={venteLivraison}
            onChange={(e) => setVenteLivraison(e.target.value)}
            placeholder="0"
          />
        </label>
        <div style={styles.tauxAutoAide}>À compléter en cas de besoin — s'ajoute au mandat total</div>

        <label style={styles.champLabel}>
          Nettoyage (€)
          <input
            style={styles.input}
            type="number"
            value={nettoyage}
            onChange={(e) => setNettoyage(e.target.value)}
            placeholder="0"
          />
        </label>
        <div style={styles.tauxAutoAide}>Montant facturé pour le nettoyage, déduit du total HT</div>

        <div style={styles.tcaApercu}>
          <span>Mandat total (€)</span>
          <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#E8A33D", fontWeight: 600 }}>
            {fmtEUR(mandatTotal)}
          </span>
        </div>
        <div style={styles.tauxAutoAide}>Calculé automatiquement : commission d'agence + frais d'intermédiation + garantie prix vendu + vente livraison</div>

        <button
          style={{ ...styles.boutonConnexion, opacity: valide ? 1 : 0.5, cursor: valide ? "pointer" : "not-allowed" }}
          disabled={!valide}
          onClick={() =>
            valide &&
            onValider({
              id: dossier.id,
              commercial_id: commercialId,
              client,
              voiture,
              plaque,
              garantie_achat: Number(garantieAchat) || 0,
              garantie_prix_vendu: Number(garantiePrixVendu) || 0,
              mandat_total: mandatTotal,
              frais_intermediation: Number(fraisIntermediation) || 0,
              nettoyage: Number(nettoyage) || 0,
              commission_agence: Number(commissionAgence) || 0,
              achat_livraison: Number(achatLivraison) || 0,
              vente_livraison: Number(venteLivraison) || 0,
              date,
            })
          }
        >
          {estEdition ? "Enregistrer les modifications" : "Enregistrer le dossier"}
        </button>
      </div>
    </div>
  );
}

// ---------- Refacturation ----------

const CATEGORIES_REFACTURATION = [
  { id: "call_center", label: "Call center" },
  { id: "leads_meta", label: "Leads Meta" },
  { id: "leboncoin", label: "Leboncoin" },
];

function Refacturation({ estAdmin, estAnimateur, donnees, onRafraichir }) {
  const [categorie, setCategorie] = useState("call_center");
  const [erreur, setErreur] = useState("");

  if (!donnees) {
    return erreur ? <div style={styles.bandeauErreur}>{erreur}</div> : null;
  }

  const peutSaisirNombre = !estAnimateur;
  const libelleMois = new Date(`${donnees.mois}-01`).toLocaleDateString("fr-FR", {
    month: "long",
    year: "numeric",
  });

  const enregistrerNombre = async (commercialId, cat, nombre) => {
    try {
      await api("/api/refacturation/nombre", {
        method: "PUT",
        body: { commercial_id: commercialId, categorie: cat, nombre },
      });
      onRafraichir();
    } catch (e) {
      setErreur(e.message);
    }
  };

  const enregistrerLeboncoin = async (commercialId, montant) => {
    try {
      await api("/api/refacturation/leboncoin", { method: "PUT", body: { commercial_id: commercialId, montant } });
      onRafraichir();
    } catch (e) {
      setErreur(e.message);
    }
  };

  const enregistrerTarif = async (cat, prixUnitaire) => {
    try {
      await api("/api/refacturation/tarifs", { method: "PUT", body: { categorie: cat, prix_unitaire: prixUnitaire } });
      onRafraichir();
    } catch (e) {
      setErreur(e.message);
    }
  };

  return (
    <div>
      <div style={styles.sectionHeader}>
        <h2 style={styles.sectionTitre}>Refacturation — {libelleMois}</h2>
      </div>

      {erreur && (
        <div style={styles.bandeauErreur}>
          {erreur}
          <button style={styles.fermerErreur} onClick={() => setErreur("")}><X size={14} /></button>
        </div>
      )}

      <div style={{ ...styles.ongletsRangee, marginBottom: 16 }}>
        {CATEGORIES_REFACTURATION.map((c) => (
          <button
            key={c.id}
            style={{ ...styles.onglet, ...(categorie === c.id ? styles.ongletActif : {}) }}
            onClick={() => setCategorie(c.id)}
          >
            {c.label}
          </button>
        ))}
      </div>

      {categorie !== "leboncoin" && (
        <TableauRefacturationCompteur
          categorie={categorie}
          donnees={donnees}
          estAdmin={estAdmin}
          peutSaisirNombre={peutSaisirNombre}
          onEnregistrerNombre={enregistrerNombre}
          onEnregistrerTarif={enregistrerTarif}
        />
      )}

      {categorie === "leboncoin" && (
        <TableauRefacturationLeboncoin
          donnees={donnees}
          estAdmin={estAdmin}
          onEnregistrerLeboncoin={enregistrerLeboncoin}
        />
      )}
    </div>
  );
}

function ChampMontantDiffere({ valeurInitiale, onValider, disabled, placeholder }) {
  const [valeur, setValeur] = useState(valeurInitiale);

  useEffect(() => {
    setValeur(valeurInitiale);
  }, [valeurInitiale]);

  return (
    <input
      style={{ ...styles.input, textAlign: "right", opacity: disabled ? 0.6 : 1 }}
      type="number"
      value={valeur}
      disabled={disabled}
      placeholder={placeholder}
      onChange={(e) => setValeur(e.target.value)}
      onBlur={() => {
        const nombre = Number(valeur) || 0;
        if (nombre !== (Number(valeurInitiale) || 0)) onValider(nombre);
      }}
    />
  );
}

function TableauRefacturationCompteur({ categorie, donnees, estAdmin, peutSaisirNombre, onEnregistrerNombre, onEnregistrerTarif }) {
  const cleNombre = categorie === "call_center" ? "nombre_call_center" : "nombre_leads_meta";
  const cleMontant = categorie === "call_center" ? "montant_call_center" : "montant_leads_meta";
  const prixUnitaire = donnees.tarifs[categorie] || 0;

  return (
    <div>
      {estAdmin && (
        <div style={{ ...styles.tcaApercu, marginBottom: 16, maxWidth: 320 }}>
          <span>Prix unitaire (€)</span>
          <ChampMontantDiffere
            valeurInitiale={prixUnitaire}
            onValider={(v) => onEnregistrerTarif(categorie, v)}
          />
        </div>
      )}
      {!estAdmin && (
        <div style={styles.tauxAutoAide}>Prix unitaire fixé par l'admin : {fmtEUR(prixUnitaire)}</div>
      )}

      <div style={styles.tableauConteneur}>
        <table style={{ ...styles.tableau, minWidth: "auto" }}>
          <thead>
            <tr>
              <th style={styles.th}>Commercial</th>
              <th style={{ ...styles.th, textAlign: "right" }}>Nombre</th>
              <th style={{ ...styles.th, textAlign: "right" }}>Montant</th>
            </tr>
          </thead>
          <tbody>
            {donnees.lignes.map((l) => (
              <tr key={l.commercial_id} style={styles.tr}>
                <td style={styles.td}>{l.commercial_nom}</td>
                <td style={{ ...styles.td, textAlign: "right" }}>
                  <ChampMontantDiffere
                    valeurInitiale={l[cleNombre]}
                    disabled={!peutSaisirNombre}
                    onValider={(v) => onEnregistrerNombre(l.commercial_id, categorie, v)}
                  />
                </td>
                <td style={{ ...styles.td, ...styles.mono, textAlign: "right" }}>{fmtEUR(l[cleMontant])}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function TableauRefacturationLeboncoin({ donnees, estAdmin, onEnregistrerLeboncoin }) {
  return (
    <div>
      {!estAdmin && (
        <div style={styles.tauxAutoAide}>Montant fixé par l'admin, propre à chaque commercial.</div>
      )}
      <div style={styles.tableauConteneur}>
        <table style={{ ...styles.tableau, minWidth: "auto" }}>

              <th style={{ ...styles.th, textAlign: "right" }}>Montant (€)</th>

          <tbody>
            {donnees.lignes.map((l) => (

// ---------- Charges fixes (admin uniquement) ----------

function ChargesFixes({ donnees, onRafraichir, onErreur }) {
  const [modal, setModal] = useState(null); // null | {} | charge existante
  const total = donnees.reduce((s, c) => s + c.montant, 0);

  const supprimer = async (c) => {
    if (!confirm(`Supprimer la charge "${c.nom}" ?`)) return;
    try {
      await api(`/api/charges-fixes/${c.id}`, { method: "DELETE" });
      onRafraichir();
    } catch (e) {
      onErreur(e.message);
    }
  };

  return (
    <div>
      <div style={styles.sectionHeader}>
        <h2 style={styles.sectionTitre}>Charges fixes</h2>
        <button style={styles.boutonAjout} onClick={() => setModal({})}>
          <Plus size={16} strokeWidth={2.5} /> Nouvelle charge
        </button>
      </div>

      {donnees.length === 0 ? (
        <div style={styles.videEtat}>Aucune charge fixe pour l'instant.</div>
      ) : (
        <div style={styles.tableauConteneur}>
          <table style={{ ...styles.tableau, minWidth: "auto" }}>
            <thead>
              <tr>
                <th style={styles.th}>Nom</th>
                <th style={{ ...styles.th, textAlign: "right" }}>Montant (€)</th>
                <th style={styles.th}></th>
              </tr>
            </thead>
            <tbody>
              {donnees.map((c) => (
                <tr key={c.id} style={styles.tr}>
                  <td style={styles.td}>{c.nom}</td>
                  <td style={{ ...styles.td, ...styles.mono, textAlign: "right" }}>{fmtEUR(c.montant)}</td>
                  <td style={{ ...styles.td, whiteSpace: "nowrap" }}>
                    <button style={styles.boutonIcone} onClick={() => setModal(c)} title="Modifier">
                      <Pencil size={14} />
                    </button>
                    <button style={styles.boutonIcone} onClick={() => supprimer(c)} title="Supprimer">
                      <Trash2 size={14} />
                    </button>
                  </td>
                </tr>
              ))}
            </tbody>
            <tfoot>
              <tr>
                <td style={{ ...styles.td, fontWeight: 600 }}>Total</td>
                <td style={{ ...styles.td, ...styles.mono, textAlign: "right", fontWeight: 600 }}>{fmtEUR(total)}</td>
                <td style={styles.td}></td>
              </tr>
            </tfoot>
          </table>
        </div>
      )}

      {modal && (
        <ModalChargeFixe
          charge={modal}
          onFermer={() => setModal(null)}
          onValider={async (payload) => {
            try {
              if (modal.id) {
                await api(`/api/charges-fixes/${modal.id}`, { method: "PUT", body: payload });
              } else {
                await api("/api/charges-fixes", { method: "POST", body: payload });
              }
              setModal(null);
              onRafraichir();
            } catch (e) {
              onErreur(e.message);
            }
          }}
        />
      )}
    </div>
  );
}

function ModalChargeFixe({ charge, onFermer, onValider }) {
  const estEdition = Boolean(charge.id);
  const [nom, setNom] = useState(charge.nom || "");
  const [montant, setMontant] = useState(charge.montant ?? "");

  const valide = nom.trim() !== "" && Number(montant) > 0;

  return (
    <div style={styles.modalFond} onClick={onFermer}>
      <div style={styles.modalCarte} onClick={(e) => e.stopPropagation()}>
        <div style={styles.modalEnTete}>
          <h3 style={styles.modalTitre}>{estEdition ? "Modifier la charge" : "Nouvelle charge"}</h3>
          <button style={styles.modalFermer} onClick={onFermer}><X size={18} /></button>
        </div>

        <label style={styles.champLabel}>
          Nom
          <input
            style={styles.input}
            value={nom}
            onChange={(e) => setNom(e.target.value)}
            placeholder="Ex: Loyer, Assurance, Logiciel…"
          />
        </label>

        <label style={styles.champLabel}>
          Montant (€)
          <input style={styles.input} type="number" value={montant} onChange={(e) => setMontant(e.target.value)} placeholder="0" />
        </label>

        <button
          style={{ ...styles.boutonConnexion, opacity: valide ? 1 : 0.5, cursor: valide ? "pointer" : "not-allowed" }}
          disabled={!valide}
          onClick={() => valide && onValider({ nom: nom.trim(), montant: Number(montant) })}
        >
          {estEdition ? "Enregistrer les modifications" : "Ajouter la charge"}
        </button>
      </div>
    </div>
  );
}

                <th style={styles.th}>Nom</th>

            <tbody>
              {animateurs.map((a) => (
                <tr key={a.id} style={styles.tr}>
                  <td style={styles.td}>{a.nom}</td>
                  <td style={styles.td}>{a.identifiant}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {modalOuverte && (
        <ModalAnimateur
          onFermer={() => setModalOuverte(false)}
          onValider={async (payload) => {
            try {
              const nouveau = await api("/api/animateurs", { method: "POST", body: payload });
              setAnimateurs((prev) => [...prev, nouveau]);
              setModalOuverte(false);
            } catch (e) {
              setErreur(e.message);
            }
          }}
        />
      )}
    </div>
  );
}

function ModalAnimateur({ onFermer, onValider }) {
  const [nom, setNom] = useState("");
  const [identifiant, setIdentifiant] = useState("");
  const [motDePasse, setMotDePasse] = useState("");

  const valide = nom.trim() !== "" && identifiant.trim() !== "" && motDePasse.trim() !== "";

  return (
    <div style={styles.modalFond} onClick={onFermer}>
      <div style={styles.modalCarte} onClick={(e) => e.stopPropagation()}>
        <div style={styles.modalEnTete}>
          <h3 style={styles.modalTitre}>Nouveau compte animateur</h3>
          <button style={styles.modalFermer} onClick={onFermer}><X size={18} /></button>
        </div>

        <label style={styles.champLabel}>
          Nom
          <input style={styles.input} value={nom} onChange={(e) => setNom(e.target.value)} placeholder="Nom complet" />
        </label>

        <label style={styles.champLabel}>
          Identifiant de connexion
          <input style={styles.input} value={identifiant} onChange={(e) => setIdentifiant(e.target.value)} placeholder="prenom.nom" />
        </label>

        <label style={styles.champLabel}>
          Mot de passe initial
          <input style={styles.input} type="password" value={motDePasse} onChange={(e) => setMotDePasse(e.target.value)} placeholder="••••••••" />
        </label>

        <button
          style={{ ...styles.boutonConnexion, opacity: valide ? 1 : 0.5, cursor: valide ? "pointer" : "not-allowed" }}
          disabled={!valide}
          onClick={() => valide && onValider({ nom, identifiant, mot_de_passe: motDePasse })}
        >
          Créer le compte
        </button>
      </div>
    </div>
  );
}

function ModalCommercial({ commercial, entreprises, onFermer, onValider }) {
  const estEdition = Boolean(commercial.id);
  const [nom, setNom] = useState(commercial.nom || "");
  const [entrepriseId, setEntrepriseId] = useState(commercial.entreprise_id || entreprises[0]?.id);
  const [tauxAuto, setTauxAuto] = useState(estEdition ? Boolean(commercial.taux_auto) : true);
  const [taux, setTaux] = useState(commercial.taux != null ? commercial.taux * 100 : "");
  const [objectif, setObjectif] = useState(commercial.objectif_ca_ht_brut ?? "");
  const [actif, setActif] = useState(commercial.actif ?? true);
  const [identifiant, setIdentifiant] = useState("");
  const [motDePasse, setMotDePasse] = useState("");
  const [avisObtenus, setAvisObtenus] = useState(commercial.avis_obtenus_mois_courant ?? 0);

  const valide = estEdition
    ? nom.trim() !== "" && (tauxAuto || Number(taux) > 0)
    : nom.trim() !== "" && (tauxAuto || Number(taux) > 0) && identifiant.trim() !== "" && motDePasse.trim() !== "";

  return (
    <div style={styles.modalFond} onClick={onFermer}>
      <div style={styles.modalCarte} onClick={(e) => e.stopPropagation()}>
        <div style={styles.modalEnTete}>
          <h3 style={styles.modalTitre}>{estEdition ? "Modifier le commercial" : "Nouveau commercial"}</h3>
          <button style={styles.modalFermer} onClick={onFermer}><X size={18} /></button>
        </div>

        <label style={styles.champLabel}>
          Nom
          <input style={styles.input} value={nom} onChange={(e) => setNom(e.target.value)} placeholder="Nom complet" />
        </label>

        <label style={styles.champLabel}>
          Entreprise
          <select value={entrepriseId} onChange={(e) => setEntrepriseId(Number(e.target.value))} style={styles.select}>
            {entreprises.map((e) => <option key={e.id} value={e.id}>{e.nom}</option>)}
          </select>
        </label>

        <label style={styles.champLabel}>
          <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <input type="checkbox" checked={tauxAuto} onChange={(e) => setTauxAuto(e.target.checked)} />
            Taux automatique
          </span>
        </label>
        <div style={styles.tauxAutoAide}>
          CA HT net du mois ≤ 8 000 € → 20% · &gt; 8 000 € → 35% · +5% si l'objectif d'avis Google est atteint
          {estEdition && (
            <> — actuellement <strong>{(commercial.taux_effectif * 100).toFixed(1)}%</strong></>
          )}
        </div>

        {!tauxAuto && (
          <label style={styles.champLabel}>
            Taux de commission manuel (%)
            <input style={styles.input} type="number" step="0.1" value={taux} onChange={(e) => setTaux(e.target.value)} placeholder="8" />
          </label>
        )}

        <label style={styles.champLabel}>
          Objectif CA HT brut mensuel (€)
          <input
            style={styles.input}
            type="number"
            value={objectif}
            onChange={(e) => setObjectif(e.target.value)}
            placeholder="Aucun objectif défini"
          />
        </label>
        {estEdition && commercial.objectif_ca_ht_brut != null && (
          <div style={styles.tauxAutoAide}>
            Ce mois-ci : {fmtEUR(commercial.ca_ht_brut_mois_courant)} sur {fmtEUR(commercial.objectif_ca_ht_brut)}
            {" — "}<strong>{commercial.pourcentage_atteinte.toFixed(0)}%</strong>
          </div>
        )}

        {estEdition && (
          <label style={styles.champLabel}>
            Avis Google obtenus ce mois-ci
            <input
              style={styles.input}
              type="number"
              step="1"
              min="0"
              value={avisObtenus}
              onChange={(e) => setAvisObtenus(e.target.value)}
            />
          </label>
        )}
        {estEdition && (
          <div style={styles.tauxAutoAide}>
            Objectif du mois : {commercial.objectif_avis_mois_courant} avis (1 par voiture vendue)
            {" — "}
            <strong>{commercial.bonus_avis_actif ? "bonus obtenu" : "bonus non obtenu"}</strong>
          </div>
        )}

        {estEdition && (
          <label style={styles.champLabel}>
            <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <input type="checkbox" checked={actif} onChange={(e) => setActif(e.target.checked)} />
              Compte actif
            </span>
          </label>
        )}

        {!estEdition && (
          <label style={styles.champLabel}>
            Identifiant de connexion
            <input style={styles.input} value={identifiant} onChange={(e) => setIdentifiant(e.target.value)} placeholder="prenom.nom" />
          </label>
        )}

        <label style={styles.champLabel}>
          {estEdition ? "Réinitialiser le mot de passe (laisser vide pour ne pas changer)" : "Mot de passe initial"}
          <input style={styles.input} type="password" value={motDePasse} onChange={(e) => setMotDePasse(e.target.value)} placeholder="••••••••" />
        </label>

        <button
          style={{ ...styles.boutonConnexion, opacity: valide ? 1 : 0.5, cursor: valide ? "pointer" : "not-allowed" }}
          disabled={!valide}
          onClick={() =>
            valide &&
            onValider(
              estEdition
                ? {
                    id: commercial.id, nom, entreprise_id: entrepriseId,
                    taux: tauxAuto ? null : Number(taux) / 100,
                    objectif_ca_ht_brut: objectif === "" ? null : Number(objectif),
                    actif, mot_de_passe: motDePasse,
                    avis_obtenus: avisObtenus === "" ? 0 : Number(avisObtenus),
                  }
                : {
                    nom, entreprise_id: entrepriseId,
                    taux: tauxAuto ? null : Number(taux) / 100,
                    objectif_ca_ht_brut: objectif === "" ? null : Number(objectif),
                    identifiant, mot_de_passe: motDePasse,
                  }
            )
          }
        >
          {estEdition ? "Enregistrer" : "Créer le commercial"}
        </button>
      </div>
    </div>
  );
}

function ModalEntreprise({ entreprise, onFermer, onValider }) {
  const estEdition = Boolean(entreprise.id);
  const [nom, setNom] = useState(entreprise.nom || "");
  const [couleur, setCouleur] = useState(entreprise.couleur || "#4FD1C5");
  const [objectif, setObjectif] = useState(entreprise.objectif_ca_ht_brut ?? "");
  const valide = nom.trim() !== "";

  return (
    <div style={styles.modalFond} onClick={onFermer}>
      <div style={styles.modalCarte} onClick={(e) => e.stopPropagation()}>
        <div style={styles.modalEnTete}>
          <h3 style={styles.modalTitre}>{estEdition ? "Modifier l'entreprise" : "Nouvelle entreprise"}</h3>
          <button style={styles.modalFermer} onClick={onFermer}><X size={18} /></button>
        </div>

        <label style={styles.champLabel}>
          Nom
          <input style={styles.input} value={nom} onChange={(e) => setNom(e.target.value)} placeholder="Nom de l'entreprise" />
        </label>

        <label style={styles.champLabel}>
          Couleur d'identification
          <input style={{ ...styles.input, height: 40, padding: 4 }} type="color" value={couleur} onChange={(e) => setCouleur(e.target.value)} />
        </label>

        <label style={styles.champLabel}>
          Objectif CA HT brut mensuel (€)
          <input
            style={styles.input}
            type="number"
            value={objectif}
            onChange={(e) => setObjectif(e.target.value)}
            placeholder="Aucun objectif défini"
          />
        </label>
        {estEdition && entreprise.objectif_ca_ht_brut != null && (
          <div style={styles.tauxAutoAide}>
            Ce mois-ci : {fmtEUR(entreprise.ca_ht_brut_mois_courant)} sur {fmtEUR(entreprise.objectif_ca_ht_brut)}
            {" — "}<strong>{entreprise.pourcentage_atteinte.toFixed(0)}%</strong>
          </div>
        )}

        <button
          style={{ ...styles.boutonConnexion, opacity: valide ? 1 : 0.5, cursor: valide ? "pointer" : "not-allowed" }}
          disabled={!valide}
          onClick={() =>
            valide &&
            onValider({ id: entreprise.id, nom, couleur, objectif_ca_ht_brut: objectif === "" ? null : Number(objectif) })
          }
        >
          {estEdition ? "Enregistrer les modifications" : "Créer l'entreprise"}
        </button>
      </div>
    </div>
  );
}
