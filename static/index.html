     sur fond clair (sans avoir à fournir un second fichier image). */

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.454.0?external=react"
  }

<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

<body>
<div id="root"></div>

<script type="text/babel" data-type="module" data-presets="react">
import React, { useState, useEffect, useCallback } from "react";
import { createRoot } from "react-dom/client";
import { Car, TrendingUp, Users, LogOut, Plus, X, Pencil, Trash2, ShieldCheck, Search, RefreshCw, Target, Building2, Minimize2, Maximize2, Star, FileSpreadsheet, FileUp, Receipt, Wallet, PiggyBank, FastForward, Sun, Moon } from "lucide-react";

// ---------- API ----------

async function api(path, options = {}) {
  const res = await fetch(path, {
    method: options.method || "GET",
    headers: options.body ? { "Content-Type": "application/json" } : undefined,
    body: options.body ? JSON.stringify(options.body) : undefined,
    credentials: "same-origin",
  });
  const isJson = res.headers.get("content-type")?.includes("application/json");
  const data = isJson ? await res.json() : null;
  if (!res.ok) {
    throw new Error((data && data.error) || `Erreur ${res.status}`);
  }
  return data;
}

const fmtEUR = (n) =>
  new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" }).format(n || 0);

// Pourcentage d'objectif : en dessous de 100 %, on arrondit à l'inférieur pour ne jamais
// afficher « 100 % » tant que l'objectif n'est pas réellement atteint.
const fmtPourcentageObjectif = (p) => (p < 100 ? Math.floor(p) : Math.round(p));

// ---------- App ----------

export default function App() {
  // Thème clair/sombre : préférence par appareil (jamais synchronisée entre
  // commerciaux), appliquée globalement via l'attribut data-theme sur <html>.
  const [theme, setTheme] = useState(() => {
    try {
      return localStorage.getItem("hse_theme") || "dark";
    } catch {
      return "dark";
    }
  });
  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    try {
      localStorage.setItem("hse_theme", theme);
    } catch {
      // Stockage indisponible (navigation privée…) : le thème reste actif pour la session en cours.
    }
  }, [theme]);

  const [chargement, setChargement] = useState(true);
  const [utilisateur, setUtilisateur] = useState(null);
  const [entreprises, setEntreprises] = useState([]);
  const [commerciaux, setCommerciaux] = useState([]);
  const [dossiers, setDossiers] = useState([]);
  const [dossiersTous, setDossiersTous] = useState([]);
  const [refacturation, setRefacturation] = useState(null);
  const [refacturationHisto, setRefacturationHisto] = useState({});
  const [chargesFixes, setChargesFixes] = useState([]);
  const [retrocommissions, setRetrocommissions] = useState([]);
  const [avis, setAvis] = useState([]);
  const [entrepriseFiltre, setEntrepriseFiltre] = useState("toutes");
  const [commercialFiltre, setCommercialFiltre] = useState("tous");
  // Par défaut, l'app s'ouvre sur le mois en cours (pas "toutes les années/tous les
  // mois") : c'est la vue qu'on veut voir en arrivant, le global reste un filtre à
  // choisir explicitement.
  const maintenant = new Date();
  const anneeCourante = String(maintenant.getFullYear());
  const moisCourant = String(maintenant.getMonth() + 1).padStart(2, "0");
  const [anneeFiltre, setAnneeFiltre] = useState(anneeCourante);
  const [moisFiltre, setMoisFiltre] = useState(moisCourant);
  const [rechercheTexte, setRechercheTexte] = useState("");
  const [vue, setVue] = useState(() =>
    new URLSearchParams(window.location.search).has("google") ? "equipe" : "tableau"
  );
  const [modalDossier, setModalDossier] = useState(null); // null | {} | dossier existant
  const [modalCommercial, setModalCommercial] = useState(null);
  const [modalEntreprise, setModalEntreprise] = useState(null); // null | {} | entreprise existante
  const [erreur, setErreur] = useState("");
  const [kpiOrder, setKpiOrder] = useState(null);
  const [kpiReduits, setKpiReduits] = useState([]);
  const [actualisation, setActualisation] = useState(false);
  const [exportEnCours, setExportEnCours] = useState(false);

  // L'admin secondaire a les mêmes accès que l'admin, sauf les tarifs de
  // refacturation et les charges fixes (voir estAdminPrincipal, réservé à ces
  // deux points précis).
  const estAdmin = utilisateur?.role === "admin" || utilisateur?.role === "admin_secondaire";
  const estAdminPrincipal = utilisateur?.role === "admin";
  const estAnimateur = utilisateur?.role === "animateur";
  const peutToutVoir = estAdmin || estAnimateur;

  useEffect(() => {
    setKpiOrder(utilisateur?.kpi_order || null);
    setKpiReduits(utilisateur?.kpi_reduits || []);
  }, [utilisateur?.id]);

  const reorganiserKpis = async (nouvelOrdre) => {
    setKpiOrder(nouvelOrdre);
    try {
      await api("/api/preferences/kpi-order", { method: "PUT", body: { order: nouvelOrdre } });
    } catch (e) {
      setErreur(e.message);
    }
  };

  const basculerReductionKpi = async (id) => {
    const nouveauxReduits = kpiReduits.includes(id)
      ? kpiReduits.filter((x) => x !== id)
      : [...kpiReduits, id];
    setKpiReduits(nouveauxReduits);
    try {
      await api("/api/preferences/kpi-reduits", { method: "PUT", body: { reduits: nouveauxReduits } });
    } catch (e) {
      setErreur(e.message);
    }
  };

  const exporterExcel = async (mode) => {
    setExportEnCours(true);
    setErreur("");
    try {
      const chemin = mode === "maj" ? "/api/export-excel/maj" : "/api/export-excel";
      const qs = entrepriseFiltre !== "toutes" ? `?entreprise_id=${entrepriseFiltre}` : "";
      const res = await fetch(`${chemin}${qs}`, { method: "POST", credentials: "same-origin" });
      if (!res.ok) {
        const data = await res.json().catch(() => null);
        throw new Error((data && data.error) || `Erreur ${res.status}`);
      }
      const blob = await res.blob();
      const entete = res.headers.get("content-disposition") || "";
      const correspondance = entete.match(/filename="?([^"]+)"?/);
      const nomFichier = correspondance ? correspondance[1] : "export-hse-motors.xlsx";
      const url = URL.createObjectURL(blob);
      const lien = document.createElement("a");
      lien.href = url;
      lien.download = nomFichier;
      document.body.appendChild(lien);
      lien.click();
      lien.remove();
      URL.revokeObjectURL(url);
    } catch (e) {
      setErreur(e.message);
    } finally {
      setExportEnCours(false);
    }
  };

  const chargerReferentiels = useCallback(async () => {
    const [ent, com] = await Promise.all([api("/api/entreprises"), api("/api/commerciaux")]);
    setEntreprises(ent);
    setCommerciaux(com);
  }, []);

  const chargerDossiers = useCallback(async (filtre) => {
    const qs = filtre && filtre !== "toutes" ? `?entreprise_id=${filtre}` : "";
    const rows = await api(`/api/dossiers${qs}`);
    setDossiers(rows);
  }, []);

  const chargerDossiersTous = useCallback(async () => {
    const rows = await api("/api/dossiers");
    setDossiersTous(rows);
  }, []);

  const chargerRefacturation = useCallback(async () => {
    const [data, histo] = await Promise.all([api("/api/refacturation"), api("/api/refacturation/historique")]);
    setRefacturation(data);
    setRefacturationHisto(histo);
  }, []);

  const chargerChargesFixes = useCallback(async () => {
    const rows = await api("/api/charges-fixes");
    setChargesFixes(rows);
  }, []);

  const chargerRetrocommissions = useCallback(async () => {
    const rows = await api("/api/retrocommissions");
    setRetrocommissions(rows);
  }, []);

  const chargerAvis = useCallback(async () => {
    const rows = await api("/api/avis");
    setAvis(rows);
  }, []);

  useEffect(() => {
    (async () => {
      try {
        const me = await api("/api/me");
        setUtilisateur(me);
        const chargeurs = [chargerReferentiels(), chargerDossiers("toutes"), chargerDossiersTous(), chargerRefacturation(), chargerRetrocommissions(), chargerAvis()];
        if (me.role === "admin" || me.role === "admin_secondaire") chargeurs.push(chargerChargesFixes());
        await Promise.all(chargeurs);
      } catch {
        setUtilisateur(null);
      } finally {
        setChargement(false);
      }
    })();
  }, [chargerReferentiels, chargerDossiers, chargerDossiersTous, chargerRefacturation, chargerChargesFixes, chargerRetrocommissions, chargerAvis]);

  useEffect(() => {
    if (utilisateur) chargerDossiers(entrepriseFiltre);
  }, [entrepriseFiltre, utilisateur, chargerDossiers]);

  const handleConnexion = async (me) => {
    setUtilisateur(me);
    setChargement(true);
    try {
      const chargeurs = [chargerReferentiels(), chargerDossiers("toutes"), chargerDossiersTous(), chargerRefacturation(), chargerRetrocommissions(), chargerAvis()];
      if (me.role === "admin" || me.role === "admin_secondaire") chargeurs.push(chargerChargesFixes());
      await Promise.all(chargeurs);
    } finally {
      setChargement(false);
    }
  };

  const handleDeconnexion = async () => {
    await api("/api/logout", { method: "POST" });
    setUtilisateur(null);
    setEntreprises([]);
    setCommerciaux([]);
    setDossiers([]);
    setDossiersTous([]);
    setRefacturation(null);
    setRefacturationHisto({});
    setChargesFixes([]);
    setRetrocommissions([]);
    setAvis([]);
    setVue("tableau");
  };

  const rafraichir = async () => {
    const chargeurs = [chargerReferentiels(), chargerDossiers(entrepriseFiltre), chargerDossiersTous(), chargerRefacturation(), chargerRetrocommissions(), chargerAvis()];
    if (estAdmin) chargeurs.push(chargerChargesFixes());
    await Promise.all(chargeurs);
  };

  const actualiserManuellement = async () => {
    setActualisation(true);
    try {
      await rafraichir();
    } catch (e) {
      setErreur(e.message);
    } finally {
      setActualisation(false);
    }
  };

  if (chargement) {
    return <div style={styles.pageChargement}>Chargement…</div>;
  }

  if (!utilisateur) {
    return <EcranConnexion onConnexion={handleConnexion} />;
  }

  // L'année en cours est toujours listée, même sans aucun dossier encore enregistré
  // dedans — sinon le filtre par défaut n'aurait pas d'option correspondante.
  const anneesDisponibles = [...new Set([anneeCourante, ...dossiersTous.map((d) => d.date.slice(0, 4))])].sort((a, b) => b.localeCompare(a));

  const rechercheNormalisee = rechercheTexte.trim().toLowerCase();

  const dossiersAffiches = dossiers.filter((d) => {
    if (commercialFiltre !== "tous" && String(d.commercial_id) !== commercialFiltre) return false;
    if (anneeFiltre !== "toutes" && d.date.slice(0, 4) !== anneeFiltre) return false;
    if (moisFiltre !== "tous" && d.date.slice(5, 7) !== moisFiltre) return false;
    if (rechercheNormalisee) {
      const dansTexte = (valeur) => (valeur || "").toLowerCase().includes(rechercheNormalisee);
      if (!dansTexte(d.client) && !dansTexte(d.voiture) && !dansTexte(d.plaque)) return false;
    }
    return true;
  });

  // Même logique de filtre entreprise/commercial que dossiersAffiches, appliquée aux
  // lignes de refacturation (mois courant uniquement, pas de filtre année/mois : ça n'a
  // pas de sens sur une donnée qui ne couvre que le mois en cours).
  const refacturationTotal = (refacturation?.lignes || [])
    .filter((l) => {
      if (commercialFiltre !== "tous" && String(l.commercial_id) !== commercialFiltre) return false;
      if (entrepriseFiltre !== "toutes") {
        const com = commerciaux.find((c) => c.id === l.commercial_id);
        if (!com || String(com.entreprise_id) !== String(entrepriseFiltre)) return false;
      }
      return true;
    })
    .reduce((s, l) => s + l.total, 0);

  // Charges fixes : propres à chaque entreprise et remises à zéro chaque mois — même
  // filtre entreprise/année/mois que les dossiers (le mois courant par défaut, mais
  // consultable sur les mois passés comme le CA).
  const chargesFixesAffichees = chargesFixes.filter((c) => {
    if (entrepriseFiltre !== "toutes" && String(c.entreprise_id) !== String(entrepriseFiltre)) return false;
    if (anneeFiltre !== "toutes" && c.mois.slice(0, 4) !== anneeFiltre) return false;
    if (moisFiltre !== "tous" && c.mois.slice(5, 7) !== moisFiltre) return false;
    return true;
  });
  // Le bénéfice se calcule sur le montant HT des charges (saisies TTC, TVA retirée).
  const chargesFixesTotal = chargesFixesAffichees.reduce((s, c) => s + c.montant_ht, 0);

  // Rétrocommissions reçues (ANNEXE 8) : même filtre que dossiersAffiches, sur le
  // commercial crédité et son entreprise (pas celle du dossier d'origine).
  const retrocommissionsAffichees = retrocommissions.filter((r) => {
    if (commercialFiltre !== "tous" && String(r.commercial_id) !== commercialFiltre) return false;
    if (entrepriseFiltre !== "toutes" && String(r.entreprise_id) !== String(entrepriseFiltre)) return false;
    if (anneeFiltre !== "toutes" && r.date.slice(0, 4) !== anneeFiltre) return false;
    if (moisFiltre !== "tous" && r.date.slice(5, 7) !== moisFiltre) return false;
    return true;
  });
  const retrocommissionsTotal = retrocommissionsAffichees.reduce((s, r) => s + r.commission, 0);

  // Avis Google : même filtre que dossiersAffiches, sur la date du dossier lié.
  const avisAffiches = avis.filter((a) => {
    if (commercialFiltre !== "tous" && String(a.commercial_id) !== commercialFiltre) return false;
    if (entrepriseFiltre !== "toutes" && String(a.entreprise_id) !== String(entrepriseFiltre)) return false;
    if (anneeFiltre !== "toutes" && a.date.slice(0, 4) !== anneeFiltre) return false;
    if (moisFiltre !== "tous" && a.date.slice(5, 7) !== moisFiltre) return false;
    return true;
  });

  // Le KPI d'atteinte d'objectif n'a de sens que pour un seul commercial à la fois :
  // soit c'est le compte connecté, soit l'admin/animateur a filtré sur une personne précise.
  let commercialCible = null;
  if (utilisateur.role === "commercial") {
    commercialCible = commerciaux.find((c) => c.id === utilisateur.commercial_id) || null;
  } else if (peutToutVoir && commercialFiltre !== "tous") {
    commercialCible = commerciaux.find((c) => String(c.id) === commercialFiltre) || null;
  }

  // Objectif par entreprise : réservé à l'admin, uniquement quand une seule
  // entreprise est sélectionnée dans le filtre.
  const entrepriseCible =
    estAdmin && entrepriseFiltre !== "toutes"
      ? entreprises.find((e) => String(e.id) === String(entrepriseFiltre)) || null
      : null;

  // Les objectifs sont mensuels : on les compare au CA HT brut du MOIS affiché par les
  // filtres (et non au mois en cours). Si la période n'est pas un mois précis (année
  // entière, tout), la comparaison n'a pas de sens et les cases d'objectif sont masquées.
  const periodeUnMois = anneeFiltre !== "toutes" && moisFiltre !== "tous";
  const dansPeriodeFiltree = (d) =>
    (anneeFiltre === "toutes" || d.date.slice(0, 4) === anneeFiltre) &&
    (moisFiltre === "tous" || d.date.slice(5, 7) === moisFiltre);
  const caBrutPeriode = (liste) => liste.filter(dansPeriodeFiltree).reduce((s, d) => s + d.mandat_total / 1.2, 0);

  const objectifCommercial =
    periodeUnMois && commercialCible && commercialCible.objectif_ca_ht_brut != null
      ? {
          objectif: commercialCible.objectif_ca_ht_brut,
          reel: caBrutPeriode(dossiers.filter((d) => d.commercial_id === commercialCible.id)),
        }
      : null;

  const objectifEntreprise =
    periodeUnMois && entrepriseCible && entrepriseCible.objectif_ca_ht_brut != null
      ? { objectif: entrepriseCible.objectif_ca_ht_brut, reel: caBrutPeriode(dossiers) }
      : null;

  // Objectif global : somme des objectifs de toutes les entreprises qui en ont un défini,
  // comparée à leur CA du mois — uniquement sur "Toutes les entreprises".
  const entreprisesAvecObjectif = entreprises.filter((e) => e.objectif_ca_ht_brut != null);
  const idsAvecObjectif = new Set(entreprisesAvecObjectif.map((e) => e.id));
  const objectifGlobalEntreprises =
    periodeUnMois && estAdmin && entrepriseFiltre === "toutes" && commercialFiltre === "tous" && entreprisesAvecObjectif.length > 0
      ? {
          objectif: entreprisesAvecObjectif.reduce((s, e) => s + e.objectif_ca_ht_brut, 0),
          reel: caBrutPeriode(dossiers.filter((d) => idsAvecObjectif.has(d.entreprise_id))),
        }
      : null;

  return (
    <div style={styles.page}>
      <TickerBandeau entreprises={entreprises} dossiers={dossiersTous} />
      <EnTete
        utilisateur={utilisateur}
        onDeconnexion={handleDeconnexion}
        onActualiser={actualiserManuellement}
        actualisation={actualisation}
        theme={theme}
        onChangerTheme={setTheme}
      />

      <div style={styles.corps}>
        {erreur && (
          <div style={styles.bandeauErreur}>
            {erreur}
            <button style={styles.fermerErreur} onClick={() => setErreur("")}><X size={14} /></button>
          </div>
        )}

        <div style={styles.ongletsRangee}>
          <button
            style={{ ...styles.onglet, ...(vue === "tableau" ? styles.ongletActif : {}) }}
            onClick={() => setVue("tableau")}
          >
            Tableau de bord
          </button>
          <button
            style={{ ...styles.onglet, ...(vue === "dossiers" ? styles.ongletActif : {}) }}
            onClick={() => setVue("dossiers")}
          >
            Dossiers
          </button>
          <button
            style={{ ...styles.onglet, ...(vue === "refacturation" ? styles.ongletActif : {}) }}
            onClick={() => setVue("refacturation")}
          >
            Refacturation
          </button>
          <button
            style={{ ...styles.onglet, ...(vue === "avis" ? styles.ongletActif : {}) }}
            onClick={() => setVue("avis")}
          >
            Avis Google
          </button>
          {peutToutVoir && (
            <button
              style={{ ...styles.onglet, ...(vue === "equipe" ? styles.ongletActif : {}) }}
              onClick={() => setVue("equipe")}
            >
              Équipe &amp; entreprises
            </button>
          )}
          {estAdmin && (
            <button
              style={{ ...styles.onglet, ...(vue === "charges" ? styles.ongletActif : {}) }}
              onClick={() => setVue("charges")}
            >
              Charges fixes
            </button>
          )}
        </div>

        {vue === "tableau" && (
          <TableauDeBord
            utilisateur={utilisateur}
            estAdmin={estAdmin}
            estAdminPrincipal={estAdminPrincipal}
            peutToutVoir={peutToutVoir}
            entreprises={entreprises}
            commerciaux={commerciaux}
            dossiersTous={dossiersTous}
            chargesFixes={chargesFixes}
            refacturationHisto={refacturationHisto}
            avis={avis}
            onVoirDossiers={() => setVue("dossiers")}
          />
        )}

        {vue === "dossiers" && (
          <>
            {peutToutVoir && (
              <FiltreEntreprises
                entreprises={entreprises}
                entrepriseFiltre={entrepriseFiltre}
                setEntrepriseFiltre={setEntrepriseFiltre}
              />
            )}

            {peutToutVoir && (
              <FiltreCommercial
                commerciaux={commerciaux}
                commercialFiltre={commercialFiltre}
                setCommercialFiltre={setCommercialFiltre}
              />
            )}

            <FiltrePeriode

function EcranConnexion({ onConnexion }) {
  const [mode, setMode] = useState("connexion"); // connexion | recuperation

  const connecter = async (e) => {
    e.preventDefault();
    setErreur("");
    setEnCours(true);
    try {
      const me = await api("/api/login", { method: "POST", body: { identifiant, mot_de_passe: motDePasse } });
      onConnexion(me);
    } catch (err) {
      setErreur(err.message);
    } finally {
      setEnCours(false);
    }
  };

  return (
    <div style={styles.pageConnexion}>
      {mode === "connexion" ? (
        <form style={styles.carteConnexion} onSubmit={connecter}>

            <input
              style={styles.input}
              value={identifiant}
              onChange={(e) => setIdentifiant(e.target.value)}
              placeholder="ex: admin"
              autoFocus
            />
          </label>

          <label style={styles.champLabel}>
            Mot de passe
            <input
              style={styles.input}
              type="password"
              value={motDePasse}
              onChange={(e) => setMotDePasse(e.target.value)}
              placeholder="••••••••"
            />
          </label>

          {erreur && <div style={styles.erreurConnexion}>{erreur}</div>}

          <button style={{ ...styles.boutonConnexion, opacity: enCours ? 0.6 : 1 }} disabled={enCours} type="submit">
            {enCours ? "Connexion…" : "Entrer"}
          </button>

          <button
            type="button"
            style={styles.lienMotDePasseOublie}
            onClick={() => { setMode("recuperation"); setErreur(""); }}

            Mot de passe oublié ?
          </button>
        </form>
      ) : (
        <RecuperationMotDePasse onRetour={() => setMode("connexion")} />
      )}
    </div>
  );
}

// ---------- Récupération mot de passe admin ----------

function RecuperationMotDePasse({ onRetour }) {
  const [etape, setEtape] = useState("demande"); // demande | saisie
  const [identifiant, setIdentifiant] = useState("admin");
  const [code, setCode] = useState("");
  const [nouveauMotDePasse, setNouveauMotDePasse] = useState("");
  const [confirmation, setConfirmation] = useState("");
  const [erreur, setErreur] = useState("");
  const [message, setMessage] = useState("");
  const [enCours, setEnCours] = useState(false);

  const demanderCode = async (e) => {
    e.preventDefault();
    setErreur("");
    setEnCours(true);
    try {
      const res = await api("/api/mot-de-passe-oublie", { method: "POST", body: { identifiant } });
      setMessage(res.message);
      setEtape("saisie");
    } catch (err) {
      setErreur(err.message);
    } finally {
      setEnCours(false);
    }
  };

  const reinitialiser = async (e) => {
    e.preventDefault();
    setErreur("");
    if (nouveauMotDePasse !== confirmation) {
      setErreur("Les deux mots de passe ne correspondent pas.");
      return;
    }
    setEnCours(true);
    try {
      await api("/api/reinitialiser-mot-de-passe", {
        method: "POST",
        body: { identifiant, code, nouveau_mot_de_passe: nouveauMotDePasse },
      });
      setMessage("Mot de passe réinitialisé. Vous pouvez vous reconnecter.");
      setTimeout(onRetour, 1500);
    } catch (err) {
      setErreur(err.message);
    } finally {
      setEnCours(false);
    }
  };

  return (
    <form style={styles.carteConnexion} onSubmit={etape === "demande" ? demanderCode : reinitialiser}>
      <div style={styles.logoConnexion}>
        <img src="/logo.png" alt="H.S.E Motors" className="hse-logo" style={styles.logoImage} />
      </div>
      <p style={styles.sousTitreConnexion}>
        {etape === "demande" ? "Récupération du mot de passe admin" : "Entrez le code reçu par email"}
      </p>

      <label style={styles.champLabel}>
        Identifiant
        <input
          style={styles.input}
          value={identifiant}
          onChange={(e) => setIdentifiant(e.target.value)}
          placeholder="admin"
          disabled={etape === "saisie"}
        />
      </label>

      {etape === "saisie" && (
        <>
          <label style={styles.champLabel}>
            Code reçu par email
            <input
              style={styles.input}
              value={code}
              onChange={(e) => setCode(e.target.value)}
              placeholder="123456"
              autoFocus
            />
          </label>
          <label style={styles.champLabel}>
            Nouveau mot de passe
            <input
              style={styles.input}
              type="password"
              value={nouveauMotDePasse}
              onChange={(e) => setNouveauMotDePasse(e.target.value)}
              placeholder="••••••••"
            />
          </label>
          <label style={styles.champLabel}>
            Confirmer le mot de passe
            <input
              style={styles.input}
              type="password"
              value={confirmation}
              onChange={(e) => setConfirmation(e.target.value)}
              placeholder="••••••••"
            />
          </label>
        </>
      )}

      {message && <div style={styles.messageConnexion}>{message}</div>}
      {erreur && <div style={styles.erreurConnexion}>{erreur}</div>}

      <button style={{ ...styles.boutonConnexion, opacity: enCours ? 0.6 : 1 }} disabled={enCours} type="submit">
        {etape === "demande" ? (enCours ? "Envoi…" : "Envoyer le code") : (enCours ? "Réinitialisation…" : "Réinitialiser le mot de passe")}
      </button>

      <button type="button" style={styles.lienMotDePasseOublie} onClick={onRetour}>
        Retour à la connexion
      </button>
    </form>
  );
}

// ---------- KPI ----------

const GARANTIE_ACHAT_NON_VENDUE = [90.15, 86.15];

function KpiRangee({ dossiers, estAdmin, peutReorganiser, kpiOrder, onReorder, commercialCible, objectifCommercial, objectifEntreprise, objectifGlobalEntreprises, refacturationTotal, estAdminStrict, chargesFixesTotal, kpiReduits, onBasculerReduction }) {
  const chiffreAffairesHT = dossiers.reduce((s, d) => s + d.total_ht, 0);
  const caTtc = dossiers.reduce((s, d) => s + d.mandat_total, 0);
  const caHtBrut = dossiers.reduce((s, d) => s + d.mandat_total / 1.2, 0);
  // Le montant refacturé (Call center + Leads Meta + Leboncoin du mois courant) vient en
  // déduction des commissions dues aux commerciaux.
  const totalCommissions = dossiers.reduce((s, d) => s + d.commission, 0) - (refacturationTotal || 0);
  const caFraisIntermediation = dossiers.reduce((s, d) => s + d.frais_intermediation, 0);
  const voituresVendues = dossiers.length;

  // Véhicule non garantissable (garantie achat = 0€) : exclu uniquement du nombre
  // de garanties vendues et du taux de véhicule garantis.
  const garantiesVendues = dossiers.filter(
    (d) =>
      Math.abs(d.garantie_achat) > 0.001 &&
      !GARANTIE_ACHAT_NON_VENDUE.some((v) => Math.abs(d.garantie_achat - v) < 0.001)
  ).length;
  const tauxVehiculesGarantis = voituresVendues > 0 ? (garantiesVendues / voituresVendues) * 100 : 0;

  const achatGarantie = dossiers.reduce((s, d) => s + d.garantie_achat, 0);

  // Garantie vendu à 0€ : pas de garantie vendue sur ce dossier, on l'ignore.
  const caGarantieVendue = dossiers
    .filter((d) => Math.abs(d.garantie_prix_vendu) > 0.001)
    .reduce((s, d) => s + (d.garantie_prix_vendu - d.garantie_achat), 0);

  const mandatMoyen = voituresVendues > 0 ? chiffreAffairesHT / voituresVendues : 0;

  const kpisBase = [
    { id: "ca_ht_net", label: "CA HT net", valeur: fmtEUR(chiffreAffairesHT), icone: TrendingUp, couleur: "var(--accent)" },
    { id: "ca_ht_brut", label: "CA HT brut", valeur: fmtEUR(caHtBrut), icone: TrendingUp, couleur: "var(--blue)" },
    { id: "ca_ttc", label: "CA TTC", valeur: fmtEUR(caTtc), icone: TrendingUp, couleur: "var(--positive)" },
    { id: "garanties_vendues", label: "Nombre de garanties vendues", valeur: garantiesVendues, icone: ShieldCheck, couleur: "var(--purple)" },
    { id: "commissions_dues", label: "Commissions dues", valeur: fmtEUR(totalCommissions), icone: Users, couleur: "var(--positive)" },
    { id: "voitures_vendues", label: "Voitures vendues", valeur: voituresVendues, icone: Car, couleur: "var(--text-muted)" },
    { id: "taux_garanti", label: "Taux de véhicule garantis", valeur: `${tauxVehiculesGarantis.toFixed(1)}%`, icone: ShieldCheck, couleur: "var(--positive)" },
    { id: "ca_frais_intermediation", label: "CA frais d'intermédiation", valeur: fmtEUR(caFraisIntermediation), icone: TrendingUp, couleur: "var(--blue)" },
    { id: "ca_garantie_vendue", label: "CA garantie vendue", valeur: fmtEUR(caGarantieVendue), icone: ShieldCheck, couleur: "var(--purple)" },
    { id: "mandat_moyen", label: "Mandat moyen", valeur: fmtEUR(mandatMoyen), icone: TrendingUp, couleur: "var(--accent)" },
    { id: "refacturation", label: "Refacturation", valeur: fmtEUR(refacturationTotal || 0), icone: Receipt, couleur: "var(--purple)" },
    ...(estAdmin
      ? [{ id: "achat_garantie", label: "Achat garantie", valeur: fmtEUR(achatGarantie), icone: TrendingUp, couleur: "var(--text-muted)" }]
      : []),
    ...(estAdminStrict
      ? [{ id: "charges_fixes", label: "Charges fixes (HT)", valeur: fmtEUR(chargesFixesTotal || 0), icone: Wallet, couleur: "var(--negative)" }]
      : []),
    ...(estAdminStrict
      ? [{
          id: "benefice",
          label: "Bénéfice",
          valeur: fmtEUR(chiffreAffairesHT - totalCommissions - (chargesFixesTotal || 0)),
          icone: PiggyBank,
          couleur: "var(--positive)",
        }]
      : []),
    ...(objectifCommercial
      ? (() => {
          const pct = (objectifCommercial.reel / objectifCommercial.objectif) * 100;
          return [{
            id: "objectif_atteinte",
            label: `Objectif du mois (${fmtEUR(objectifCommercial.objectif)})`,
            valeur: `${fmtPourcentageObjectif(pct)}%`,
            icone: Target,
            couleur: pct >= 100 ? "var(--positive)" : pct >= 50 ? "var(--accent)" : "var(--negative)",
          }];
        })()
      : []),
    ...(commercialCible
      ? [{
          id: "bonus_avis_google",
          label: commercialCible.bonus_avis_actif
            ? `Bonus avis Google obtenu (${commercialCible.avis_obtenus_mois_courant}/${commercialCible.objectif_avis_mois_courant} avis)`
            : `Bonus avis Google si atteint (${commercialCible.avis_obtenus_mois_courant}/${commercialCible.objectif_avis_mois_courant} avis)`,
          valeur: fmtEUR(chiffreAffairesHT * 0.05),
          icone: Star,
          couleur: commercialCible.bonus_avis_actif ? "var(--positive)" : "var(--text-muted)",
        }]
      : []),
    ...(objectifEntreprise
      ? (() => {
          const pct = (objectifEntreprise.reel / objectifEntreprise.objectif) * 100;
          return [{
            id: "objectif_entreprise_atteinte",
            label: `Objectif entreprise du mois (${fmtEUR(objectifEntreprise.objectif)})`,
            valeur: `${fmtPourcentageObjectif(pct)}%`,
            icone: Building2,
            couleur: pct >= 100 ? "var(--positive)" : pct >= 50 ? "var(--accent)" : "var(--negative)",
          }];
        })()
      : []),
    ...(objectifGlobalEntreprises
      ? (() => {
          const pct = (objectifGlobalEntreprises.reel / objectifGlobalEntreprises.objectif) * 100;
          return [{
            id: "objectif_global_entreprises",
            label: `Objectif global du mois (${fmtEUR(objectifGlobalEntreprises.objectif)})`,
            valeur: `${fmtPourcentageObjectif(pct)}%`,
            icone: Building2,
            couleur: pct >= 100 ? "var(--positive)" : pct >= 50 ? "var(--accent)" : "var(--negative)",
          }];
        })()
      : []),
  ];

  const ordreVoulu = kpiOrder && kpiOrder.length ? kpiOrder : kpisBase.map((k) => k.id);
  const parId = Object.fromEntries(kpisBase.map((k) => [k.id, k]));
  const kpis = [
    ...ordreVoulu.map((id) => parId[id]).filter(Boolean),
    ...kpisBase.filter((k) => !ordreVoulu.includes(k.id)),
  ];

  const [indexGlisse, setIndexGlisse] = useState(null);

  const deplacer = (indexSource, indexCible) => {
    if (indexSource === indexCible || Number.isNaN(indexSource)) return;
    const nouvelOrdre = kpis.map((k) => k.id);
    const [retire] = nouvelOrdre.splice(indexSource, 1);
    nouvelOrdre.splice(indexCible, 0, retire);
    onReorder && onReorder(nouvelOrdre);
  };

  return (
    <div style={styles.kpiRangee}>
      {kpis.map((k, index) => {
        const estReduit = (kpiReduits || []).includes(k.id);
        // Les 3 premiers KPI de l'ordre choisi (glisser-déposer) s'affichent en grand,
        // les suivants en version compacte — sans icône ni encadré individuel une fois
        // dépassé ce rang, pour une vue plus simple. Faire glisser un KPI en tête (ou
        // hors des 3 premiers) suffit à basculer son style, aucun réglage séparé.
        const estHero = index < 3 && !estReduit;
        const estDetail = index >= 3 && !estReduit;
        return (
          <div
            key={k.id}
            className={estReduit ? undefined : "kpi-carte-pleine"}
            style={{
              ...styles.kpiCarte,
              ...(estReduit ? styles.kpiCarteReduite : estHero ? styles.kpiCarteHero : styles.kpiCarteDetail),
              ...(peutReorganiser ? styles.kpiCarteDeplacable : {}),
              ...(indexGlisse === index ? styles.kpiCarteEnCoursDeplacement : {}),
            }}
            draggable={peutReorganiser}
            onDragStart={(e) => {
              e.dataTransfer.setData("text/plain", String(index));
              e.dataTransfer.effectAllowed = "move";
              setIndexGlisse(index);
            }}
            onDragOver={(e) => e.preventDefault()}
            onDrop={(e) => {
              e.preventDefault();
              deplacer(Number(e.dataTransfer.getData("text/plain")), index);
            }}
            onDragEnd={() => setIndexGlisse(null)}
          >
            {estReduit && (
              <div style={{ ...styles.kpiIcone, background: `color-mix(in srgb, ${k.couleur} 16%, transparent)`, ...styles.kpiIconeReduite }}>
                <k.icone size={15} color={k.couleur} strokeWidth={2} />
              </div>
            )}
            {estHero && (
              <div style={{ display: "flex", flexDirection: "column", width: "100%" }}>
                <div style={styles.kpiLabel}>{k.label}</div>
                <div style={styles.kpiValeurHero}>{k.valeur}</div>
              </div>
            )}
            {estDetail && (
              <div style={{ display: "flex", flexDirection: "column", width: "100%" }}>
                <div style={styles.kpiLabel}>{k.label}</div>
                <div style={styles.kpiValeur}>{k.valeur}</div>
              </div>
            )}
            {estReduit && <div style={styles.kpiValeurReduite}>{k.valeur}</div>}
            {onBasculerReduction && (
              <button
                type="button"
                className="kpi-reduire"
                title={estReduit ? "Agrandir ce KPI" : "Réduire ce KPI"}
                style={{ ...styles.kpiBoutonReduire, ...(estReduit ? styles.kpiBoutonReduireCompact : {}) }}
                onMouseDown={(e) => e.stopPropagation()}
                onClick={(e) => {
                  e.stopPropagation();
                  onBasculerReduction(k.id);
                }}
              >
                {estReduit ? <Maximize2 size={12} /> : <Minimize2 size={12} />}
              </button>
            )}
          </div>
        );
      })}
    </div>
  );
}

function useColonnesFigees() {
  // Les colonnes figées (position: sticky) entrent en conflit avec le geste de
  // défilement tactile sur petit écran (bug WebKit connu sur iOS Safari en portrait).
  // On les désactive en dessous de 640px : le tableau reste défilable normalement.
  const [actives, setActives] = useState(
    typeof window !== "undefined" ? window.innerWidth >= 640 : true
  );
  useEffect(() => {
    const maj = () => setActives(window.innerWidth >= 640);
    window.addEventListener("resize", maj);
    return () => window.removeEventListener("resize", maj);
  }, []);
  return actives;
}

// ---------- Modale dossier (création / édition) ----------

const MOYENS_PAIEMENT = ["CB", "Virement bancaire", "Lien de paiement"];

function ModalDossier({ dossier, estAdmin, commerciaux, utilisateur, onFermer, onValider }) {
  const estEdition = Boolean(dossier.id);
  const [commercialId, setCommercialId] = useState(
    dossier.commercial_id || (estAdmin ? commerciaux[0]?.id : utilisateur.commercial_id)
  );
  const [client, setClient] = useState(dossier.client || "");
  const [voiture, setVoiture] = useState(dossier.voiture || "");
  const [plaque, setPlaque] = useState(dossier.plaque || "");
  const [garantieAchat, setGarantieAchat] = useState(dossier.garantie_achat ?? "");
  const [garantiePrixVendu, setGarantiePrixVendu] = useState(dossier.garantie_prix_vendu ?? "");
  const [fraisIntermediation, setFraisIntermediation] = useState(dossier.frais_intermediation ?? "");
  const [moyenPaiement, setMoyenPaiement] = useState(dossier.moyen_paiement || "");
  const [nettoyage, setNettoyage] = useState(dossier.nettoyage ?? "");
  const [commissionAgence, setCommissionAgence] = useState(dossier.commission_agence ?? "");
  const [achatLivraison, setAchatLivraison] = useState(dossier.achat_livraison ?? "");
  const [venteLivraison, setVenteLivraison] = useState(dossier.vente_livraison ?? "");
  const [date, setDate] = useState(dossier.date || new Date().toISOString().slice(0, 10));

  // Rétrocommission : le commercial du dossier n'a fait que l'entrée OU que la sortie
  // du mandat, l'autre partie revient à un second commercial (ANNEXE 8).
  const [retrocommissionActive, setRetrocommissionActive] = useState(
    Boolean(dossier.role_commercial && dossier.role_commercial !== "les_deux")
  );
  const [retrocommissionCommercialId, setRetrocommissionCommercialId] = useState(
    dossier.retrocommission?.commercial_id ?? ""
  );
  const [retrocommissionRole, setRetrocommissionRole] = useState(dossier.retrocommission?.role || "sortant");

  const roleCommercialPrincipal = !retrocommissionActive
    ? "les_deux"
    : retrocommissionRole === "sortant" ? "entrant" : "sortant";

  const autresCommerciaux = commerciaux.filter((c) => c.id !== commercialId);

  // Mandat total n'est plus saisi : il se déduit de ces montants.
  const mandatTotal =
    (Number(commissionAgence) || 0) +
    (Number(fraisIntermediation) || 0) +
    (Number(garantiePrixVendu) || 0) +
    (Number(venteLivraison) || 0);

  // Le moyen de paiement n'est obligatoire que s'il y a effectivement des frais
  // d'intermédiation à payer.
  const moyenPaiementRequis = (Number(fraisIntermediation) || 0) > 0;

  const valide =
    client.trim() !== "" &&
    voiture.trim() !== "" &&
    mandatTotal > 0 &&
    (!moyenPaiementRequis || Boolean(moyenPaiement)) &&
    (!retrocommissionActive || Boolean(retrocommissionCommercialId));

  return (
    <div style={styles.modalFond} onClick={onFermer}>
      <div style={styles.modalCarte} onClick={(e) => e.stopPropagation()}>
        <div style={styles.modalEnTete}>
          <h3 style={styles.modalTitre}>{estEdition ? "Modifier le dossier" : "Nouveau dossier"}</h3>
          <button style={styles.modalFermer} onClick={onFermer}>
            <X size={18} />
          </button>
        </div>

        {estAdmin && (
          <label style={styles.champLabel}>
            Commercial
            <select value={commercialId} onChange={(e) => setCommercialId(Number(e.target.value))} style={styles.select}>
              {commerciaux.map((c) => (
                <option key={c.id} value={c.id}>{c.nom}</option>
              ))}
            </select>
          </label>
        )}

        <label style={styles.champLabel}>
          Date
          <input style={styles.input} type="date" value={date} onChange={(e) => setDate(e.target.value)} />
        </label>

        <label style={styles.champLabel}>
          Client
          <input style={styles.input} value={client} onChange={(e) => setClient(e.target.value)} placeholder="Nom du client" />
        </label>

        <label style={styles.champLabel}>
          Voiture
          <input style={styles.input} value={voiture} onChange={(e) => setVoiture(e.target.value)} placeholder="Ex: Peugeot 3008" />
        </label>

        <label style={styles.champLabel}>
          Plaque d'immatriculation
          <input
            style={styles.input}
            value={plaque}
            onChange={(e) => setPlaque(e.target.value.toUpperCase())}
            placeholder="AA-123-BB"
          />
        </label>

        <label style={styles.champLabel}>
          Frais d'intermédiation (€)
          <input
            style={styles.input}
            type="number"
            value={fraisIntermediation}
            onChange={(e) => setFraisIntermediation(e.target.value)}
            placeholder="0"
          />
        </label>

        <label style={styles.champLabel}>
          Moyen de paiement des frais d'intermédiation{moyenPaiementRequis && " *"}
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 8 }}>
            {MOYENS_PAIEMENT.map((m) => (
              <button
                key={m}
                type="button"
                style={{ ...styles.puceFiltre, ...(moyenPaiement === m ? styles.puceFiltreActive : {}) }}
                onClick={() => setMoyenPaiement(moyenPaiement === m ? "" : m)}
              >
                {m}
              </button>
            ))}
          </div>
          {moyenPaiementRequis && !moyenPaiement && (
            <div style={{ ...styles.tauxAutoAide, color: "var(--negative)" }}>
              Obligatoire dès qu'il y a des frais d'intermédiation.
            </div>
          )}
        </label>

        <label style={styles.champLabel}>
          Commission d'agence (€)
          <input
            style={styles.input}
            type="number"
            value={commissionAgence}
            onChange={(e) => setCommissionAgence(e.target.value)}
            placeholder="0"
          />
        </label>

        <label style={styles.champLabel}>
          Garantie prix vendu (€)
          <input style={styles.input} type="number" value={garantiePrixVendu} onChange={(e) => setGarantiePrixVendu(e.target.value)} placeholder="0" />

const CATEGORIES_REFACTURATION = [
  { id: "call_center", label: "Call center" },
  { id: "leads_meta", label: "Leads Meta" },

];

function Refacturation({ estAdmin, estAdminPrincipal, estAnimateur, donnees, onRafraichir }) {
  const [categorie, setCategorie] = useState("call_center");
  const [erreur, setErreur] = useState("");

  if (!donnees) {
    return erreur ? <div style={styles.bandeauErreur}>{erreur}</div> : null;
  }

  const peutSaisirNombre = !estAnimateur;
  const libelleMois = new Date(`${donnees.mois}-01`).toLocaleDateString("fr-FR", {
    month: "long",
    year: "numeric",
  });

  const enregistrerNombre = async (commercialId, cat, nombre) => {
    try {
      await api("/api/refacturation/nombre", {
        method: "PUT",
        body: { commercial_id: commercialId, categorie: cat, nombre },
      });
      onRafraichir();
    } catch (e) {
      setErreur(e.message);
    }
  };

  const enregistrerLeboncoin = async (commercialId, montant) => {
    try {
      await api("/api/refacturation/leboncoin", { method: "PUT", body: { commercial_id: commercialId, montant } });
      onRafraichir();
    } catch (e) {
      setErreur(e.message);
    }
  };

  const enregistrerTarif = async (cat, prixUnitaire) => {
    try {
      await api("/api/refacturation/tarifs", { method: "PUT", body: { categorie: cat, prix_unitaire: prixUnitaire } });
      onRafraichir();
    } catch (e) {
      setErreur(e.message);
    }
  };

  return (
    <div>
      <div style={styles.sectionHeader}>
        <h2 style={styles.sectionTitre}>Refacturation — {libelleMois}</h2>
      </div>

      {erreur && (
        <div style={styles.bandeauErreur}>
          {erreur}
          <button style={styles.fermerErreur} onClick={() => setErreur("")}><X size={14} /></button>

      )}

            key={c.id}

      {categorie !== "leboncoin" && (

          estAdmin={estAdmin}
          onEnregistrerLeboncoin={enregistrerLeboncoin}
        />
      )}
    </div>
  );
}

function ChampMontantDiffere({ valeurInitiale, onValider, disabled, placeholder }) {
  const [valeur, setValeur] = useState(valeurInitiale);

  useEffect(() => {
    setValeur(valeurInitiale);
  }, [valeurInitiale]);

  return (
    <input
      style={{ ...styles.input, textAlign: "right", opacity: disabled ? 0.6 : 1 }}
      type="number"
      value={valeur}
      disabled={disabled}
      placeholder={placeholder}
      onChange={(e) => setValeur(e.target.value)}
      onBlur={() => {
        const nombre = Number(valeur) || 0;
        if (nombre !== (Number(valeurInitiale) || 0)) onValider(nombre);
      }}
    />
  );
}

// ---------- Charges fixes (admin uniquement) ----------

function moisCourantStr() {
  return new Date().toISOString().slice(0, 7);
}

function libelleMois(mois) {
  return new Date(`${mois}-01`).toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
}

function ChargesFixes({ donnees, entreprises, entrepriseFiltre, onRafraichir, onErreur, peutModifier }) {
  const [modal, setModal] = useState(null); // null | {} | charge existante
  const total = donnees.reduce((s, c) => s + c.montant, 0);
  const totalHt = donnees.reduce((s, c) => s + c.montant_ht, 0);
  const moisCourant = moisCourantStr();
  const afficherEntreprise = entrepriseFiltre === "toutes";

  const supprimer = async (c) => {
    if (!confirm(`Supprimer la charge "${c.nom}" ?`)) return;
    try {
      await api(`/api/charges-fixes/${c.id}`, { method: "DELETE" });
      onRafraichir();
    } catch (e) {
      onErreur(e.message);
    }
  };

  return (
    <div>
      <div style={styles.sectionHeader}>
        <h2 style={styles.sectionTitre}>Charges fixes</h2>
        {peutModifier && (
          <button style={styles.boutonAjout} onClick={() => setModal({})}>
            <Plus size={16} strokeWidth={2.5} /> Nouvelle charge
          </button>
        )}
      </div>
      <div style={styles.tauxAutoAide}>
        Remises à zéro chaque mois et propres à chaque entreprise — les mois passés restent consultables mais ne
        sont plus modifiables. {!peutModifier && "Lecture seule — réservé à l'administrateur principal."}
        {" "}Saisie en TTC ; le bénéfice se calcule sur le montant HT (TVA à 20% retirée automatiquement).
      </div>

      {donnees.length === 0 ? (
        <div style={styles.videEtat}>Aucune charge fixe pour ce filtre.</div>
      ) : (
        <div style={styles.tableauConteneur}>
          <table style={{ ...styles.tableau, minWidth: "auto" }}>
            <thead>
              <tr>
                {afficherEntreprise && <th style={styles.th}>Entreprise</th>}
                <th style={styles.th}>Mois</th>
                <th style={styles.th}>Nom</th>
                <th style={{ ...styles.th, textAlign: "right" }}>Montant TTC (€)</th>
                <th style={{ ...styles.th, textAlign: "right" }}>Montant HT (€)</th>
                <th style={styles.th}></th>
              </tr>
            </thead>
            <tbody>
              {donnees.map((c) => {
                const modifiable = peutModifier && c.mois === moisCourant;
                return (
                  <tr key={c.id} style={styles.tr}>
                    {afficherEntreprise && (
                      <td style={styles.td}>
                        <span style={styles.puceEntreprise}>
                          <span style={{ ...styles.puceCouleur, background: c.entreprise_couleur }} />
                          {c.entreprise_nom}
                        </span>
                      </td>
                    )}
                    <td style={styles.td}>{libelleMois(c.mois)}</td>
                    <td style={styles.td}>{c.nom}</td>
                    <td style={{ ...styles.td, ...styles.mono, textAlign: "right" }}>{fmtEUR(c.montant)}</td>
                    <td style={{ ...styles.td, ...styles.mono, textAlign: "right", color: "var(--text-muted)" }}>{fmtEUR(c.montant_ht)}</td>
                    <td style={{ ...styles.td, whiteSpace: "nowrap" }}>
                      {modifiable && (
                        <>
                          <button style={styles.boutonIcone} onClick={() => setModal(c)} title="Modifier">
                            <Pencil size={14} />
                          </button>
                          <button style={styles.boutonIcone} onClick={() => supprimer(c)} title="Supprimer">
                            <Trash2 size={14} />
                          </button>
                        </>
                      )}
                    </td>
                  </tr>
                );
              })}
            </tbody>
            <tfoot>
              <tr>
                {afficherEntreprise && <td style={styles.td}></td>}
                <td style={{ ...styles.td, fontWeight: 600 }} colSpan={2}>Total</td>
                <td style={{ ...styles.td, ...styles.mono, textAlign: "right", fontWeight: 600 }}>{fmtEUR(total)}</td>
                <td style={{ ...styles.td, ...styles.mono, textAlign: "right", fontWeight: 600, color: "var(--text-muted)" }}>{fmtEUR(totalHt)}</td>
                <td style={styles.td}></td>
              </tr>
            </tfoot>
          </table>
        </div>
      )}

      {modal && (
        <ModalChargeFixe
          charge={modal}
          entreprises={entreprises}
          entrepriseIdParDefaut={entrepriseFiltre !== "toutes" ? Number(entrepriseFiltre) : null}
          onFermer={() => setModal(null)}
          onValider={async (payload) => {
            try {
              if (modal.id) {
                await api(`/api/charges-fixes/${modal.id}`, { method: "PUT", body: payload });
              } else {
                await api("/api/charges-fixes", { method: "POST", body: payload });
              }
              setModal(null);
              onRafraichir();
            } catch (e) {
              onErreur(e.message);
            }
          }}
        />
      )}
    </div>
  );
}

  );

  const valide = nom.trim() !== "" && Number(montant) > 0 && (estEdition || Boolean(entrepriseId));

  return (
    <div style={styles.modalFond} onClick={onFermer}>
      <div style={styles.modalCarte} onClick={(e) => e.stopPropagation()}>
        <div style={styles.modalEnTete}>
          <h3 style={styles.modalTitre}>{estEdition ? "Modifier la charge" : "Nouvelle charge"}</h3>
          <button style={styles.modalFermer} onClick={onFermer}><X size={18} /></button>
        </div>

        {estEdition ? (
          <div style={styles.tauxAutoAide}>
            {charge.entreprise_nom} — {libelleMois(charge.mois)}

        ) : (
          <label style={styles.champLabel}>
            Entreprise
            <select value={entrepriseId} onChange={(e) => setEntrepriseId(Number(e.target.value))} style={styles.select}>
              {entreprises.map((e) => (
                <option key={e.id} value={e.id}>{e.nom}</option>
              ))}
            </select>
          </label>
        )}

        <label style={styles.champLabel}>
          Nom
          <input
            style={styles.input}
            value={nom}
            onChange={(e) => setNom(e.target.value)}
            placeholder="Ex: Loyer, Assurance, Logiciel…"
          />
        </label>

        <label style={styles.champLabel}>
          Montant TTC (€)
          <input style={styles.input} type="number" value={montant} onChange={(e) => setMontant(e.target.value)} placeholder="0" />
        </label>

        <div style={styles.tcaApercu}>
          <span>Montant HT (TVA 20% retirée)</span>
          <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: "var(--text-muted)", fontWeight: 600 }}>
            {fmtEUR((Number(montant) || 0) / 1.2)}
          </span>
        </div>

        <button
          style={{ ...styles.boutonConnexion, opacity: valide ? 1 : 0.5, cursor: valide ? "pointer" : "not-allowed" }}
          disabled={!valide}
          onClick={() => valide && onValider({ nom: nom.trim(), montant: Number(montant), entreprise_id: entrepriseId })}
        >
          {estEdition ? "Enregistrer les modifications" : "Ajouter la charge"}
        </button>
      </div>
    </div>
  );
}

function ModalAvis({ commerciaux, dossiersTous, retrocommissions, estAdmin, utilisateur, onFermer, onValider }) {
  const [commercialId, setCommercialId] = useState(estAdmin ? (commerciaux[0]?.id ?? "") : utilisateur.commercial_id);
  const [dossierId, setDossierId] = useState("");
  const [nomClient, setNomClient] = useState("");
  const [role, setRole] = useState("vendeur");

  const dossiersDisponibles = [
    ...dossiersTous.filter((d) => String(d.commercial_id) === String(commercialId)),
    ...retrocommissions
      .filter((r) => String(r.commercial_id) === String(commercialId))
      .map((r) => ({ id: r.dossier_id, date: r.date, client: r.client, voiture: r.voiture })),
  ].sort((a, b) => b.date.localeCompare(a.date));

// ---------- Tableau de bord (graphiques) ----------

function decalerMois(mois, delta) {
  const [a, m] = mois.split("-").map(Number);
  const d = new Date(a, m - 1 + delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}

function libelleMoisCourt(mois) {
  const [a, m] = mois.split("-").map(Number);
  return new Date(a, m - 1, 1).toLocaleDateString("fr-FR", { month: "short" });
}

function variationPourcent(actuel, precedent) {
  if (!precedent) return null;
  return ((actuel - precedent) / Math.abs(precedent)) * 100;
}

function plafondLisible(valeur) {
  if (valeur <= 0) return 1;
  const puissance = Math.pow(10, Math.floor(Math.log10(valeur)));
  const f = valeur / puissance;
  const n = f <= 1.2 ? 1.2 : f <= 2 ? 2 : f <= 4 ? 4 : f <= 6 ? 6 : f <= 8 ? 8 : 10;
  return n * puissance;
}

const fmtMilliers = (v) => (v / 1000).toLocaleString("fr-FR", { maximumFractionDigits: 1 });

function Sparkline({ valeurs, couleur }) {
  const min = Math.min(...valeurs);
  const max = Math.max(...valeurs);
  const ecart = max - min || 1;
  const points = valeurs
    .map((v, i) => `${(2 + (i * 92) / (valeurs.length - 1)).toFixed(1)},${(28 - ((v - min) / ecart) * 24).toFixed(1)}`)
    .join(" ");
  return (
    <svg width="96" height="32" viewBox="0 0 96 32" aria-hidden="true">
      <polyline points={points} fill="none" style={{ stroke: couleur }} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function GraphiqueEvolution({ serie, moisListe, avecBenefice }) {
  // Sur téléphone on dessine sur une largeur réduite pour que les textes restent lisibles.
  const [etroit, setEtroit] = useState(window.innerWidth < 640);
  useEffect(() => {
    const surRedim = () => setEtroit(window.innerWidth < 640);
    window.addEventListener("resize", surRedim);
    return () => window.removeEventListener("resize", surRedim);
  }, []);
  const LARGEUR = etroit ? 340 : 760;
  const L = etroit ? 34 : 48, R = LARGEUR - 10, HAUT = 20, BAS = 190;
  const maxPositif = Math.max(...serie.map((s) => s.caHtNet), ...(avecBenefice ? serie.map((s) => s.benefice) : [0]), 0);
  const minNegatif = avecBenefice ? Math.min(...serie.map((s) => s.benefice), 0) : 0;
  const haut = plafondLisible(maxPositif);
  const bas = minNegatif < 0 ? -plafondLisible(-minNegatif) : 0;
  const y = (v) => HAUT + ((haut - v) / (haut - bas)) * (BAS - HAUT);
  const pas = (R - L) / serie.length;
  const centre = (i) => L + pas * (i + 0.5);
  const graduations = [0, 1, 2, 3, 4].map((k) => bas + ((haut - bas) * k) / 4);
  const ligne = serie.map((s, i) => `${centre(i).toFixed(1)},${y(s.benefice).toFixed(1)}`).join(" ");
  const resume = serie.map((s, i) => `${libelleMoisCourt(moisListe[i])} : CA HT net ${Math.round(s.caHtNet)} euros`).join(", ");
  return (
    <svg width="100%" viewBox={`0 0 ${LARGEUR} 230`} role="img" aria-label={`Évolution sur 6 mois. ${resume}`} style={{ marginTop: 14 }}>
      {graduations.map((g, i) => (
        <g key={i}>
          <line x1={L} x2={R} y1={y(g)} y2={y(g)} style={{ stroke: "var(--border)" }} strokeWidth="1" />
          <text x={L - 8} y={y(g) + 4} textAnchor="end" style={{ fill: "var(--text-muted)", font: "500 11px 'Inter', sans-serif" }}>
            {fmtMilliers(g)}
          </text>
        </g>
      ))}
      {serie.map((s, i) => {
        const hauteur = Math.abs(y(Math.max(s.caHtNet, 0)) - y(Math.min(s.caHtNet, 0)));
        return (
          <rect
            key={i}
            x={centre(i) - Math.min(22, pas * 0.32)}
            y={y(Math.max(s.caHtNet, 0))}
            width={Math.min(44, pas * 0.64)}
            height={Math.max(hauteur, 0)}
            rx="6"
            style={{ fill: "var(--accent)", opacity: i === serie.length - 1 ? 0.55 : 1 }}
          />
        );
      })}
      {avecBenefice && (
        <>
          <polyline points={ligne} fill="none" style={{ stroke: "var(--positive)" }} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
          {serie.map((s, i) => (
            <circle key={i} cx={centre(i)} cy={y(s.benefice)} r="5" style={{ fill: "var(--surface)", stroke: "var(--positive)" }} strokeWidth="2.5" />
          ))}
        </>
      )}
      {moisListe.map((m, i) => (
        <text key={m} x={centre(i)} y="214" textAnchor="middle" style={{ fill: "var(--text-muted)", font: "500 12px 'Inter', sans-serif" }}>
          {libelleMoisCourt(m)}
        </text>
      ))}
    </svg>
  );
}

function Anneau({ parts, centreTexte, centreLibelle }) {
  const R = 60;
  const circ = 2 * Math.PI * R;
  const total = parts.reduce((s, p) => s + p.valeur, 0);
  let cumul = 0;
  return (
    <svg width="170" height="170" viewBox="0 0 170 170" role="img" aria-label={parts.map((p) => `${p.nom} ${Math.round((p.valeur / total) * 100)} %`).join(", ")}>
      <g transform="rotate(-90 85 85)" fill="none" strokeWidth="24">
        {parts.map((p) => {
          const longueur = (p.valeur / total) * circ;
          const el = <circle key={p.nom} cx="85" cy="85" r={R} style={{ stroke: p.couleur }} strokeDasharray={`${longueur} ${circ}`} strokeDashoffset={-cumul} />;
          cumul += longueur;
          return el;
        })}
      </g>
      <text x="85" y="82" textAnchor="middle" style={{ fill: "var(--text)", font: "600 13px 'IBM Plex Mono', monospace" }}>{centreTexte}</text>
      <text x="85" y="102" textAnchor="middle" style={{ fill: "var(--text-muted)", font: "500 11.5px 'Inter', sans-serif" }}>{centreLibelle}</text>
    </svg>
  );
}

function Jauge({ pourcentage }) {
  const longueur = Math.min(Math.max(pourcentage, 0), 100) * 2.513;
  // En dessous de 100 %, on arrondit à l'inférieur : 99,98 % ne doit pas s'afficher « 100 % »
  // tant que l'objectif n'est pas atteint.
  const affiche = pourcentage < 100 ? Math.floor(pourcentage) : Math.round(pourcentage);
  return (
    <svg width="210" height="128" viewBox="0 0 200 118" role="img" aria-label={`Objectif atteint à ${affiche} %`}>
      <path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" style={{ stroke: "var(--surface-2)" }} strokeWidth="18" strokeLinecap="round" />
      <path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" style={{ stroke: "var(--accent)" }} strokeWidth="18" strokeLinecap="round" strokeDasharray={`${longueur} 251.3`} />
      <text x="100" y="92" textAnchor="middle" style={{ fill: "var(--text)", font: "600 30px 'IBM Plex Mono', monospace" }}>{affiche} %</text>
    </svg>
  );
}

// ---------- Top des véhicules vendus ----------

// Le champ « Véhicule » est du texte libre (« Clio 4 », « Renault Clio III »…). On le
// ramène à « Marque Modèle » pour que toutes les générations d'un même modèle se cumulent.
const MARQUES_VEHICULES = {
