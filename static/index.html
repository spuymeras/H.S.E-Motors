  seat: ["leon", "ibiza", "ateca", "arona", "alhambra"],
  kia: ["niro", "picanto", "sportage", "ceed", "rio", "stonic", "sorento"],
  ford: ["fiesta", "focus", "mustang", "kuga", "puma", "mondeo", "ka", "transit"],
  toyota: ["aygo", "yaris", "c-hr", "corolla", "rav4", "auris", "prius"],
  nissan: ["juke", "qashqai", "micra", "leaf", "note", "x-trail"],
  suzuki: ["vitara", "swift", "ignis", "jimny"],
  mercedes: ["viano", "classe", "vito", "sprinter", "cla", "gla", "glc"],
  porsche: ["macan", "cayenne", "panamera", "boxster", "cayman", "911"],
};
const AUTRES_MARQUES_VEHICULES = [
  "fiat", "skoda", "opel", "hyundai", "mg", "infiniti", "chevrolet", "jeep", "honda", "mazda", "lexus", "volvo", "alfa",
  "jaguar", "tesla", "cupra", "smart", "lancia", "subaru", "mitsubishi", "chrysler", "ssangyong", "maserati", "lada", "land", "dodge", "saab",
];
const ALIAS_MARQUES_VEHICULES = { vw: "volkswagen", "mercedes-benz": "mercedes", "alfa-romeo": "alfa", "land-rover": "land", citroën: "citroen" };
const MARQUE_DU_MODELE = {};
Object.entries(MARQUES_VEHICULES).forEach(([marque, modeles]) => modeles.forEach((m) => { if (!(m in MARQUE_DU_MODELE) && m !== "mini") MARQUE_DU_MODELE[m] = marque; }));
const MARQUES_AFFICHEES = { bmw: "BMW", mg: "MG", ds: "DS", vw: "VW", alfa: "Alfa Romeo", land: "Land Rover", citroen: "Citroën", mercedes: "Mercedes" };
const MODELES_AFFICHES = { megane: "Mégane", scenic: "Scénic", serie: "Série", zoe: "ZOE", eos: "EOS", "t-roc": "T-Roc", "t-cross": "T-Cross", "c-hr": "C-HR" };
// Profils d'agence (lignes de comptabilité, pas des ventes de voitures) : exclus du top,
// que ce soit par le nom du commercial ou par le texte saisi dans « Véhicule ».
const VEHICULES_IGNORES = ["agence", "redon"];
const PROFILS_EXCLUS_TOP_VEHICULES = ["agence", "redon"];

function sansAccents(texte) {
  return texte.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
}

function majusculeInitiale(mot) {
  return mot.charAt(0).toUpperCase() + mot.slice(1);
}

function afficherModele(cle) {
  if (MODELES_AFFICHES[cle]) return MODELES_AFFICHES[cle];
  if (/\d/.test(cle) && /[a-z]/.test(cle)) return cle.toUpperCase(); // a3, x2, c4
  if (cle.length <= 2) return cle.toUpperCase();
  return majusculeInitiale(cle);
}

// Retourne { cle, nom } ou null si la ligne ne désigne pas un véhicule (vide, « Agence »…).
function identifierVehicule(texte) {
  const mots = sansAccents(texte || "").split(" ").filter(Boolean);
  if (mots.length === 0 || VEHICULES_IGNORES.includes(mots[0])) return null;

  let marque;
  let reste;
  const premier = ALIAS_MARQUES_VEHICULES[mots[0]] || mots[0];
  if (MARQUES_VEHICULES[premier] || AUTRES_MARQUES_VEHICULES.includes(premier)) {
    marque = premier;
    reste = mots.slice(1);
  } else if (/^ds\d+$/.test(premier)) {
    marque = "ds";
    reste = [premier.slice(2)];
  } else if (MARQUE_DU_MODELE[premier]) {
    marque = MARQUE_DU_MODELE[premier];
    reste = mots;
  } else {
    marque = premier;
    reste = mots.slice(1);
  }

  let modele = reste[0] || marque;
  // « Série 1 », « Classe A » : le chiffre ou la lettre fait partie du modèle.
  if ((modele === "serie" || modele === "classe") && reste[1]) modele = `${modele} ${reste[1]}`;

  const nomMarque = MARQUES_AFFICHEES[marque] || majusculeInitiale(marque);
  const nomModele = modele.split(" ").map(afficherModele).join(" ");
  const nom = modele === marque ? nomMarque : `${nomMarque} ${nomModele}`;
  return { cle: `${marque}|${modele}`, nom };
}

function TopVehicules({ dossiers, estAdmin, carte, titre, sous, piste }) {
  const [mode, setMode] = useState("cumul"); // cumul | mois | periode
  const [mois, setMois] = useState("");
  const [de, setDe] = useState("");
  const [a, setA] = useState("");

  const moisDisponibles = [...new Set(dossiers.map((d) => d.date.slice(0, 7)))].sort((x, y) => y.localeCompare(x));
  const libelle = (m) => { const t = libelleMois(m); return t.charAt(0).toUpperCase() + t.slice(1); };

  let retenus = dossiers;
  let resume = "Tous les mois cumulés";
  if (estAdmin && mode === "mois" && moisDisponibles.length > 0) {
    const m = mois || moisDisponibles[0];
    retenus = dossiers.filter((d) => d.date.slice(0, 7) === m);
    resume = libelle(m);
  } else if (estAdmin && mode === "periode" && moisDisponibles.length > 0) {
    const debut = de || moisDisponibles[moisDisponibles.length - 1];
    const fin = a || moisDisponibles[0];
    const [min, max] = debut <= fin ? [debut, fin] : [fin, debut];
    retenus = dossiers.filter((d) => d.date.slice(0, 7) >= min && d.date.slice(0, 7) <= max);
    resume = `${libelle(min)} → ${libelle(max)}`;
  }

  const groupes = {};
  retenus.forEach((d) => {
    if (PROFILS_EXCLUS_TOP_VEHICULES.includes(sansAccents(d.commercial_nom || ""))) return;
    const v = identifierVehicule(d.voiture);
    if (!v) return;
    const g = (groupes[v.cle] = groupes[v.cle] || { nom: v.nom, ventes: 0, ca: 0 });
    g.ventes += 1;
    g.ca += d.total_ht;
  });
  const top = Object.values(groupes).sort((x, y) => y.ventes - x.ventes || y.ca - x.ca || x.nom.localeCompare(y.nom, "fr")).slice(0, 3);
  const maxVentes = Math.max(...top.map((t) => t.ventes), 1);

  const selectPetit = { ...styles.selectFiltre, padding: "6px 10px" };
  const choixMois = (valeur, onChange, defaut) => (
    <select style={selectPetit} value={valeur || defaut} onChange={(e) => onChange(e.target.value)}>
      {moisDisponibles.map((m) => <option key={m} value={m}>{libelle(m)}</option>)}
    </select>
  );

  return (
    <section style={{ ...carte, padding: "24px 26px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12 }}>
        <div>
          <div style={titre}>Top 3 des véhicules vendus</div>
          <div style={sous}>{resume} · nombre de ventes par modèle</div>
        </div>
        {estAdmin && (
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
            <select style={selectPetit} value={mode} onChange={(e) => setMode(e.target.value)} aria-label="Période du classement">
              <option value="cumul">Cumul total</option>
              <option value="mois">Un mois précis</option>
              <option value="periode">Une période</option>
            </select>
            {mode === "mois" && choixMois(mois, setMois, moisDisponibles[0])}
            {mode === "periode" && (
              <>
                <span style={{ fontSize: 12.5, color: "var(--text-muted)" }}>du</span>
                {choixMois(de, setDe, moisDisponibles[moisDisponibles.length - 1])}
                <span style={{ fontSize: 12.5, color: "var(--text-muted)" }}>au</span>
                {choixMois(a, setA, moisDisponibles[0])}
              </>
            )}
          </div>
        )}
      </div>

      {top.length > 0 ? (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(210px, 1fr))", gap: 16, marginTop: 20 }}>
          {top.map((t, i) => (
            <div key={t.nom} style={{ background: "var(--surface-2)", borderRadius: 14, padding: "18px 20px" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <span style={{
                  width: 30, height: 30, borderRadius: "50%", display: "inline-flex", alignItems: "center", justifyContent: "center",
                  fontFamily: "'IBM Plex Mono', monospace", fontWeight: 600, fontSize: 14,
                  background: i === 0 ? "var(--accent)" : "var(--surface)", color: i === 0 ? "var(--on-accent)" : "var(--text)",
                  border: i === 0 ? "none" : "1px solid var(--border-strong)",
                }}>{i + 1}</span>
                <span style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 16, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{t.nom}</span>
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginTop: 16 }}>
                <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 24, fontWeight: 600 }}>
                  {t.ventes} <span style={{ fontSize: 13, fontWeight: 500, color: "var(--text-muted)" }}>vente{t.ventes > 1 ? "s" : ""}</span>
                </span>
              </div>
              <div style={{ ...piste, marginTop: 10, background: "var(--surface)" }}>
                <div style={{ height: "100%", borderRadius: 4, background: "var(--accent)", width: `${(t.ventes / maxVentes) * 100}%` }} />
              </div>
              <div style={{ fontSize: 12.5, color: "var(--text-muted)", marginTop: 10 }}>
                CA HT net : <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: "var(--text)", fontWeight: 600 }}>{fmtEUR(t.ca)}</span>
              </div>
            </div>
          ))}
        </div>
      ) : (
        <div style={styles.videEtat}>Aucune vente sur cette période.</div>
      )}
    </section>
  );
}

function EtoilesNote({ note }) {
  return (
    <span style={{ position: "relative", display: "inline-block", fontSize: 18, letterSpacing: 2, lineHeight: 1 }} role="img" aria-label={`${note.toLocaleString("fr-FR")} étoiles sur 5`}>
      <span style={{ color: "var(--surface-2)" }}>★★★★★</span>
      <span style={{ position: "absolute", left: 0, top: 0, overflow: "hidden", whiteSpace: "nowrap", width: `${(note / 5) * 100}%`, color: "var(--accent)" }}>★★★★★</span>
    </span>
  );
}

function TableauDeBord({ utilisateur, estAdmin, estAdminPrincipal, peutToutVoir, entreprises, commerciaux, dossiersTous, chargesFixes, refacturationHisto, avis, onVoirDossiers }) {
  const maintenant = new Date();
  const moisActuelReel = `${maintenant.getFullYear()}-${String(maintenant.getMonth() + 1).padStart(2, "0")}`;
  const [mois, setMois] = useState(moisActuelReel);
  const [entrepriseId, setEntrepriseId] = useState("toutes");

  const estCommercial = utilisateur.role === "commercial";
  const entrepriseDe = Object.fromEntries(commerciaux.map((c) => [c.id, c.entreprise_id]));
  const dansPerimetre = (idEntreprise) => entrepriseId === "toutes" || String(idEntreprise) === String(entrepriseId);

  const dossiersDuMois = (m) => dossiersTous.filter((d) => d.date.slice(0, 7) === m && dansPerimetre(d.entreprise_id));
  const refacturationDuMois = (m) =>
    Object.entries(refacturationHisto[m] || {})
      .filter(([commercialId]) => dansPerimetre(entrepriseDe[commercialId]))
      .reduce((s, [, v]) => s + v, 0);
  const chargesDuMois = (m) =>
    chargesFixes.filter((c) => c.mois === m && dansPerimetre(c.entreprise_id)).reduce((s, c) => s + c.montant_ht, 0);

  // Mêmes formules que les KPI de l'onglet Dossiers : commissions dues = commissions
  // des dossiers moins la refacturation du mois ; bénéfice = CA HT net - commissions
  // dues - charges fixes HT.
  const chiffres = (m) => {
    const ds = dossiersDuMois(m);
    const caHtNet = ds.reduce((s, d) => s + d.total_ht, 0);
    const commissions = ds.reduce((s, d) => s + d.commission, 0) - refacturationDuMois(m);
    return {
      caTtc: ds.reduce((s, d) => s + d.mandat_total, 0),
      caHtBrut: ds.reduce((s, d) => s + d.mandat_total / 1.2, 0),
      caHtNet,
      commissions,
      benefice: caHtNet - commissions - chargesDuMois(m),
      ventes: ds.length,
    };
  };

  const moisListe = [-5, -4, -3, -2, -1, 0].map((k) => decalerMois(mois, k));
  const serie = moisListe.map(chiffres);
  const actuel = serie[5];
  const precedent = serie[4];
  const ds = dossiersDuMois(mois);

  const tuiles = [
    { cle: "caTtc", label: "CA TTC", format: fmtEUR },
    { cle: "caHtBrut", label: "CA HT brut", format: fmtEUR },
    { cle: "commissions", label: estCommercial ? "Mes commissions" : "Commissions dues", format: fmtEUR },
    estAdminPrincipal
      ? { cle: "benefice", label: "Bénéfice", format: fmtEUR, vert: true }
      : { cle: "ventes", label: "Voitures vendues", format: (v) => String(v) },
  ];

  // Objectif mensuel : celui du commercial, de l'entreprise filtrée, ou la somme des
  // entreprises qui en ont un (admin, vue globale).
  let objectif = null;
  let realise = actuel.caHtBrut;
  if (estCommercial) {
    objectif = commerciaux.find((c) => c.id === utilisateur.commercial_id)?.objectif_ca_ht_brut ?? null;
  } else if (estAdmin && entrepriseId !== "toutes") {
    objectif = entreprises.find((e) => String(e.id) === String(entrepriseId))?.objectif_ca_ht_brut ?? null;
  } else if (estAdmin) {
    const avecObjectif = entreprises.filter((e) => e.objectif_ca_ht_brut != null);
    if (avecObjectif.length > 0) {
      objectif = avecObjectif.reduce((s, e) => s + e.objectif_ca_ht_brut, 0);
      const ids = new Set(avecObjectif.map((e) => e.id));
      realise = ds.filter((d) => ids.has(d.entreprise_id)).reduce((s, d) => s + d.mandat_total / 1.2, 0);
    }
  }

  // Note Google saisie à la main : celle de l'entreprise filtrée (ou du commercial),
  // sinon la moyenne des entreprises renseignées, pondérée par leur nombre d'avis.
  const entreprisesNotees = entreprises.filter((e) => {
    if (e.note_google == null) return false;
    if (estCommercial) return e.id === utilisateur.entreprise_id;
    return dansPerimetre(e.id);
  });
  let noteGoogle = null;
  let nbAvisGoogle = null;
  if (entreprisesNotees.length > 0) {
    const poids = entreprisesNotees.map((e) => e.nb_avis_google || 0);
    const totalPoids = poids.reduce((s, v) => s + v, 0);
    noteGoogle = totalPoids > 0
      ? entreprisesNotees.reduce((s, e, i) => s + e.note_google * poids[i], 0) / totalPoids
      : entreprisesNotees.reduce((s, e) => s + e.note_google, 0) / entreprisesNotees.length;
    if (totalPoids > 0) nbAvisGoogle = totalPoids;
  }

  const repartition = entreprises
    .map((e) => ({ nom: e.nom, couleur: e.couleur, valeur: Math.max(0, ds.filter((d) => d.entreprise_id === e.id).reduce((s, d) => s + d.total_ht, 0)) }))
    .filter((p) => p.valeur > 0);
  const totalRepartition = repartition.reduce((s, p) => s + p.valeur, 0);

  const classement = estCommercial
    ? [...ds].sort((a, b) => b.total_ht - a.total_ht).slice(0, 5).map((d) => ({ nom: `${d.client} — ${d.voiture}`, valeur: d.total_ht }))
    : Object.values(
        ds.reduce((acc, d) => {
          acc[d.commercial_id] = acc[d.commercial_id] || { nom: d.commercial_nom, valeur: 0 };
          acc[d.commercial_id].valeur += d.total_ht;
          return acc;
        }, {})
      ).sort((a, b) => b.valeur - a.valeur).slice(0, 5);
  const maxClassement = Math.max(...classement.map((c) => c.valeur), 1);

  const livrees = ds.filter((d) => d.livre).length;
  const avisDuMois = avis.filter((a) => a.date.slice(0, 7) === mois && dansPerimetre(a.entreprise_id)).length;

  const carte = { background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 16 };
  const titre = { fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, fontWeight: 600 };
  const sous = { fontSize: 12.5, color: "var(--text-muted)", marginTop: 6 };
  const piste = { height: 8, borderRadius: 4, background: "var(--surface-2)", overflow: "hidden" };
  const libelle = (m) => { const t = libelleMois(m); return t.charAt(0).toUpperCase() + t.slice(1); };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", flexWrap: "wrap", gap: 14 }}>
        <div>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <button style={{ ...styles.boutonDeconnexion, padding: "6px 13px", fontSize: 18, lineHeight: 1 }} onClick={() => setMois(decalerMois(mois, -1))} title="Mois précédent" aria-label="Mois précédent">‹</button>
            <h2 style={{ ...styles.sectionTitre, fontSize: 26, minWidth: 190, textAlign: "center" }}>{libelle(mois)}</h2>
            <button
              style={{ ...styles.boutonDeconnexion, padding: "6px 13px", fontSize: 18, lineHeight: 1, opacity: mois >= moisActuelReel ? 0.4 : 1 }}
              disabled={mois >= moisActuelReel}
              onClick={() => setMois(decalerMois(mois, 1))}
              title="Mois suivant"
              aria-label="Mois suivant"
            >›</button>
          </div>
          {estCommercial && <div style={{ ...sous, marginLeft: 40 }}>Vos chiffres personnels</div>}
        </div>
        {peutToutVoir && (
          <FiltreEntreprises
            entreprises={entreprises}
            entrepriseFiltre={entrepriseId}
            setEntrepriseFiltre={setEntrepriseId}
          />
        )}
      </div>

      <section style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(210px, 1fr))", gap: 16 }}>
        {tuiles.map((t) => {
          const v = variationPourcent(actuel[t.cle], precedent[t.cle]);
          return (
            <div key={t.cle} style={{ ...carte, padding: "20px 22px", ...(t.vert ? { borderColor: "var(--positive)" } : {}) }}>
              <div style={{ fontSize: 12.5, color: "var(--text-muted)" }}>{t.label}</div>
              <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 26, fontWeight: 600, marginTop: 10, lineHeight: 1, color: t.vert ? "var(--positive)" : "var(--text)" }}>
                {t.format(actuel[t.cle])}
              </div>
              <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", marginTop: 14, gap: 8 }}>
                <span style={{ fontSize: 12.5, fontWeight: 600, color: v == null || Math.abs(v) < 1 ? "var(--text-muted)" : v > 0 ? "var(--positive)" : "var(--negative)" }}>
                  {v == null ? "—" : Math.abs(v) < 1 ? "● stable" : `${v > 0 ? "▲" : "▼"} ${Math.abs(v).toFixed(0)} % vs ${libelleMoisCourt(moisListe[4])}`}
                </span>
                <Sparkline valeurs={serie.map((s) => s[t.cle])} couleur={t.vert ? "var(--positive)" : "var(--accent)"} />
              </div>
            </div>
          );
        })}
      </section>

      <section style={{ display: "flex", flexWrap: "wrap", gap: 16 }}>
        <div style={{ ...carte, padding: "24px 26px", flex: "2 1 460px", minWidth: 0 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 10 }}>
            <div>
              <div style={titre}>Évolution sur 6 mois</div>
              <div style={sous}>{estAdminPrincipal ? "CA HT net et bénéfice" : "CA HT net"}, en milliers d'euros</div>
            </div>
            <div style={{ display: "flex", gap: 16, fontSize: 12.5, color: "var(--text-muted)" }}>
              <span style={{ display: "flex", alignItems: "center", gap: 7 }}><span style={{ width: 10, height: 10, borderRadius: 3, background: "var(--accent)" }} />CA HT net</span>
              {estAdminPrincipal && <span style={{ display: "flex", alignItems: "center", gap: 7 }}><span style={{ width: 14, height: 3, borderRadius: 2, background: "var(--positive)" }} />Bénéfice</span>}
            </div>
          </div>
          <GraphiqueEvolution serie={serie} moisListe={moisListe} avecBenefice={estAdminPrincipal} />
        </div>

        {peutToutVoir && entrepriseId === "toutes" && (
          <div style={{ ...carte, padding: "24px 26px", flex: "1 1 260px", display: "flex", flexDirection: "column" }}>
            <div style={titre}>Par entreprise</div>
            <div style={sous}>Part du CA HT net du mois</div>
            {totalRepartition > 0 ? (
              <>
                <div style={{ display: "flex", justifyContent: "center", margin: "18px 0 14px" }}>
                  <Anneau parts={repartition} centreTexte={fmtEUR(totalRepartition)} centreLibelle="CA HT net" />
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 10, fontSize: 13.5 }}>
                  {repartition.map((p) => (
                    <div key={p.nom} style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <span style={{ display: "flex", alignItems: "center", gap: 9 }}><span style={{ width: 8, height: 8, borderRadius: "50%", background: p.couleur }} />{p.nom}</span>
                      <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontWeight: 600 }}>{Math.round((p.valeur / totalRepartition) * 100)} %</span>
                    </div>
                  ))}
                </div>
              </>
            ) : (
              <div style={styles.videEtat}>Aucune vente ce mois-ci.</div>
            )}
          </div>
        )}
      </section>

      <section style={{ display: "flex", flexWrap: "wrap", gap: 16 }}>
        <div style={{ ...carte, padding: "24px 26px", flex: "1 1 240px", display: "flex", flexDirection: "column", alignItems: "center" }}>
          <div style={{ ...titre, alignSelf: "flex-start" }}>Objectif du mois</div>
          {objectif ? (
            <>
              <div style={{ ...sous, alignSelf: "flex-start" }}>CA HT brut visé : {fmtEUR(objectif)}</div>
              <div style={{ marginTop: 16 }}><Jauge pourcentage={(realise / objectif) * 100} /></div>
              <div style={{ ...sous, marginTop: 8 }}>
                {fmtEUR(realise)} réalisés{realise < objectif ? ` · reste ${fmtEUR(objectif - realise)}` : " · objectif atteint"}
              </div>
            </>
          ) : (
            <div style={{ ...styles.videEtat, padding: "30px 0" }}>Aucun objectif défini.</div>
          )}
        </div>

        <div style={{ ...carte, padding: "24px 26px", flex: "1.3 1 300px", minWidth: 0 }}>
          <div style={titre}>{estCommercial ? "Mes meilleures ventes" : "Classement des commerciaux"}</div>
          <div style={sous}>CA HT net du mois</div>
          {classement.length > 0 ? (
            <div style={{ display: "flex", flexDirection: "column", gap: 16, marginTop: 20 }}>
              {classement.map((c, i) => (
                <div key={`${c.nom}-${i}`}>
                  <div style={{ display: "flex", justifyContent: "space-between", gap: 10, fontSize: 13.5, fontWeight: 500, marginBottom: 8 }}>
                    <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{c.nom}</span>
                    <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontWeight: 600, whiteSpace: "nowrap" }}>{fmtEUR(c.valeur)}</span>
                  </div>
                  <div style={piste}><div style={{ height: "100%", borderRadius: 4, background: "var(--accent)", width: `${Math.max(2, (Math.max(c.valeur, 0) / maxClassement) * 100)}%` }} /></div>
                </div>
              ))}
            </div>
          ) : (
            <div style={styles.videEtat}>Aucune vente ce mois-ci.</div>
          )}
        </div>

        <div style={{ ...carte, padding: "24px 26px", flex: "1 1 260px", display: "flex", flexDirection: "column", gap: 24 }}>
          <div>
            <div style={titre}>Livraisons</div>
            <div style={sous}>{livrees} livrée{livrees > 1 ? "s" : ""} sur {ds.length} vente{ds.length > 1 ? "s" : ""}</div>
            <div style={{ ...piste, height: 12, borderRadius: 6, marginTop: 14 }}>
              <div style={{ height: "100%", borderRadius: 6, background: "var(--positive)", width: `${ds.length ? (livrees / ds.length) * 100 : 0}%` }} />
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", marginTop: 10, fontSize: 12.5, color: "var(--text-muted)" }}>
              <span>{ds.length ? Math.round((livrees / ds.length) * 100) : 0} % livrées</span>
              <span>{ds.length - livrees} à livrer</span>
            </div>
          </div>
          <div style={{ borderTop: "1px solid var(--border)", paddingTop: 20 }}>
            <div style={titre}>Avis Google</div>
            {noteGoogle != null && (
              <div style={{ display: "flex", alignItems: "baseline", flexWrap: "wrap", gap: 10, marginTop: 14 }}>
                <span style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 34, fontWeight: 600, lineHeight: 1 }}>
                  {noteGoogle.toLocaleString("fr-FR", { minimumFractionDigits: 1, maximumFractionDigits: 1 })}
                </span>
                <EtoilesNote note={noteGoogle} />
                {nbAvisGoogle != null && (
                  <span style={{ fontSize: 12.5, color: "var(--text-muted)" }}>{nbAvisGoogle} avis Google</span>
                )}
              </div>
            )}
            <div style={sous}>{avisDuMois} avis attribué{avisDuMois > 1 ? "s" : ""} pour {ds.length} vente{ds.length > 1 ? "s" : ""}</div>
            <div style={{ ...piste, marginTop: 12 }}>
              <div style={{ height: "100%", borderRadius: 4, background: "var(--accent)", width: `${ds.length ? Math.min(100, (avisDuMois / ds.length) * 100) : 0}%` }} />
            </div>
          </div>
        </div>
      </section>

      <TopVehicules
        dossiers={dossiersTous.filter((d) => dansPerimetre(d.entreprise_id))}
        estAdmin={estAdmin}
        carte={carte}
        titre={titre}
        sous={sous}
        piste={piste}
      />

      <section style={{ ...carte, overflow: "hidden" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "18px 22px", borderBottom: "1px solid var(--border)", gap: 10, flexWrap: "wrap" }}>
          <span style={titre}>Derniers dossiers du mois</span>
          <button style={styles.boutonSecondaire} onClick={onVoirDossiers}>Voir tous les dossiers</button>
        </div>
        {ds.length === 0 ? (
          <div style={styles.videEtat}>Aucun dossier ce mois-ci.</div>
        ) : (
          <div style={{ overflowX: "auto" }}>
            <table style={{ ...styles.tableau, minWidth: "auto" }}>
              <thead>
                <tr>
                  <th style={styles.th}>Date</th>
                  <th style={styles.th}>Client</th>
                  <th style={styles.th}>Véhicule</th>
                  {!estCommercial && <th style={styles.th}>Commercial</th>}
                  <th style={styles.th}>Livraison</th>
                  <th style={{ ...styles.th, textAlign: "right" }}>Mandat TTC</th>
                  <th style={{ ...styles.th, textAlign: "right" }}>Commission</th>
                </tr>
              </thead>
              <tbody>
                {[...ds].sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id).slice(0, 5).map((d) => (
                  <tr key={d.id} style={styles.tr}>
                    <td style={styles.td}>{new Date(d.date).toLocaleDateString("fr-FR")}</td>
                    <td style={{ ...styles.td, fontWeight: 500 }}>{d.client}</td>
                    <td style={styles.td}>{d.voiture}</td>
                    {!estCommercial && <td style={styles.td}>{d.commercial_nom}</td>}
                    <td style={styles.td}>
                      <span style={{
                        fontSize: 11.5, fontWeight: 600, padding: "5px 10px", borderRadius: 20,
                        background: d.livre ? "color-mix(in srgb, var(--positive) 16%, transparent)" : "color-mix(in srgb, var(--accent) 16%, transparent)",
                        color: d.livre ? "var(--positive)" : "var(--text)",
                      }}>{d.livre ? "Livré" : "À livrer"}</span>
                    </td>
                    <td style={{ ...styles.td, ...styles.mono, textAlign: "right" }}>{fmtEUR(d.mandat_total)}</td>
                    <td style={{ ...styles.td, ...styles.mono, textAlign: "right", color: "var(--positive)" }}>{fmtEUR(d.commission)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </section>
    </div>
  );
}

// ---------- Note Google saisie à la main (admin principal) ----------

function NotesGoogleManuelles({ entreprises, onEnregistre }) {
  const [saisies, setSaisies] = useState({});
  const [enCours, setEnCours] = useState(null);
  const [erreur, setErreur] = useState("");
  const [message, setMessage] = useState("");

  const virgule = (v) => (v == null ? "" : String(v).replace(".", ","));
  const valeur = (e, champ) => {
    const s = saisies[e.id];
    if (s && champ in s) return s[champ];
    return virgule(champ === "note" ? e.note_google : e.nb_avis_google);
  };
  const modifier = (e, champ, v) => setSaisies((prec) => ({ ...prec, [e.id]: { ...prec[e.id], [champ]: v } }));

  const enregistrer = async (e) => {
    setEnCours(e.id);
    setErreur("");
    setMessage("");
    try {
      await api(`/api/entreprises/${e.id}/note-google`, {
        method: "PUT",
        body: { note: valeur(e, "note"), nb_avis: valeur(e, "nb_avis") },
      });
      setSaisies((prec) => { const { [e.id]: _, ...reste } = prec; return reste; });
      setMessage(`Note de ${e.nom} enregistrée.`);
      if (onEnregistre) await onEnregistre();
    } catch (err) {
      setErreur(err.message);
    } finally {
      setEnCours(null);
    }
  };

  return (
    <div style={{ marginTop: 40 }}>
      <div style={styles.sectionHeader}>
        <h2 style={styles.sectionTitre}>Avis Google — note saisie à la main</h2>
      </div>
      <div style={{ ...styles.tauxAutoAide, marginTop: 0 }}>
        Recopiez la note affichée sur la fiche Google de chaque agence (ex : 4,8) et son nombre d'avis. Elle apparaît sur
        le tableau de bord. Laissez vide pour ne rien afficher.
      </div>
      {erreur && (
        <div style={styles.bandeauErreur}>
          {erreur}
          <button style={styles.fermerErreur} onClick={() => setErreur("")}><X size={14} /></button>
        </div>
      )}
      {message && <div style={styles.messageConnexion}>{message}</div>}
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {entreprises.map((e) => (
          <div
            key={e.id}

// ---------- Connexion des fiches Google (admin principal) ----------

function ConnexionsGoogle() {
  const [donnees, setDonnees] = useState(null);
  const [erreur, setErreur] = useState("");
  const [message, setMessage] = useState("");
  const [enCours, setEnCours] = useState(null);

  const charger = useCallback(async () => {
    try {
      setDonnees(await api("/api/google/connexions"));
    } catch (e) {
      setErreur(e.message);
    }
  }, []);

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    if (params.has("google")) {
      if (params.get("google") === "ok") setMessage("Compte Google connecté.");
      else setErreur(params.get("detail") || "La connexion à Google a échoué.");
      window.history.replaceState({}, "", window.location.pathname);
    }
    charger();
  }, [charger]);

  const agir = async (entrepriseId, action, succes) => {
    setEnCours(entrepriseId);
    setErreur("");
    setMessage("");
    try {
      const resultat = await action();
      setMessage(typeof succes === "function" ? succes(resultat) : succes);
    } catch (e) {
      setErreur(e.message);
    } finally {
      setEnCours(null);
      await charger();
    }
  };

  const quand = (iso) => (iso ? new Date(iso + "Z").toLocaleString("fr-FR") : "jamais");

  if (!donnees) return erreur ? <div style={styles.bandeauErreur}>{erreur}</div> : null;

  return (
    <div style={{ marginTop: 40 }}>
      <div style={styles.sectionHeader}>
        <h2 style={styles.sectionTitre}>Avis Google — connexion des fiches</h2>
      </div>
      <div style={{ ...styles.tauxAutoAide, marginTop: 0 }}>
        Chaque agence se connecte avec le compte Google qui possède sa fiche. Une fois l'établissement choisi, les avis
        sont récupérés automatiquement chaque jour.
      </div>

      {erreur && (
        <div style={styles.bandeauErreur}>
          {erreur}
          <button style={styles.fermerErreur} onClick={() => setErreur("")}><X size={14} /></button>
        </div>
      )}
      {message && <div style={styles.messageConnexion}>{message}</div>}
      {!donnees.configure && (
        <div style={styles.bandeauErreur}>
          <span>
            Connexion Google non configurée sur le serveur (variables GOOGLE_CLIENT_ID et GOOGLE_CLIENT_SECRET).
            Adresse de redirection à déclarer dans Google Cloud : <strong>{donnees.adresse_retour}</strong>
          </span>
        </div>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {donnees.connexions.map((c) => (
          <div
            key={c.entreprise_id}
            style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 12, padding: "16px 18px" }}
          >
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
              <strong>{c.entreprise_nom}</strong>
              {c.connectee ? (
                <span style={{ fontSize: 12.5, color: "var(--positive)" }}>Connectée · {c.email}</span>
              ) : (
                <button
                  style={{ ...styles.boutonAjout, opacity: donnees.configure ? 1 : 0.5 }}
                  disabled={!donnees.configure}
                  onClick={() => { window.location.href = `/api/google/connecter?entreprise_id=${c.entreprise_id}`; }}
                >
                  Connecter le compte Google
                </button>
              )}
            </div>

            {c.connectee && (
              <div style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 10 }}>
                {c.lieux.length > 0 ? (
                  <label style={{ ...styles.champLabel, marginBottom: 0 }}>
                    Établissement Google
                    <select
                      style={styles.select}
                      value={c.lieu_id || ""}
                      disabled={enCours === c.entreprise_id}
                      onChange={(e) =>
                        agir(c.entreprise_id, () => api(`/api/google/connexions/${c.entreprise_id}/lieu`, { method: "PUT", body: { lieu_id: e.target.value } }), "Établissement enregistré.")
                      }
                    >
                      {!c.lieu_id && <option value="">Choisir l'établissement…</option>}
                      {c.lieux.map((l) => <option key={l.id} value={l.id}>{l.nom}</option>)}
                    </select>
                  </label>
                ) : (
                  <div style={{ fontSize: 12.5, color: "var(--text-muted)" }}>
                    Aucun établissement trouvé pour l'instant (l'accès à l'API Google doit être approuvé).
                  </div>
                )}

                <div style={{ fontSize: 12.5, color: "var(--text-muted)" }}>
                  {c.nb_avis} avis récupérés · dernière synchronisation : {quand(c.derniere_sync)}
                </div>
                {c.derniere_erreur && <div style={{ fontSize: 12.5, color: "var(--negative)" }}>{c.derniere_erreur}</div>}

                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <button
                    style={{ ...styles.boutonSecondaire, opacity: c.lieu_id ? 1 : 0.5 }}
                    disabled={!c.lieu_id || enCours === c.entreprise_id}
                    onClick={() =>
                      agir(c.entreprise_id, () => api(`/api/google/connexions/${c.entreprise_id}/synchroniser`, { method: "POST" }),
                        (r) => `${r.total} avis lus, ${r.nouveaux} nouveau(x).`)
                    }
                  >
                    <RefreshCw size={14} /> Synchroniser maintenant
                  </button>
                  <button
                    style={styles.boutonSecondaire}
                    disabled={enCours === c.entreprise_id}
                    onClick={() =>
                      agir(c.entreprise_id, () => api(`/api/google/connexions/${c.entreprise_id}/lieux`, { method: "POST" }), "Liste des établissements mise à jour.")
                    }
                  >
                    Recharger les établissements
                  </button>
                  <button
                    style={styles.boutonSecondaire}
                    disabled={enCours === c.entreprise_id}
                    onClick={() => {
                      if (!confirm(`Déconnecter le compte Google de ${c.entreprise_nom} ? Les avis déjà récupérés sont conservés.`)) return;
                      agir(c.entreprise_id, () => api(`/api/google/connexions/${c.entreprise_id}`, { method: "DELETE" }), "Compte Google déconnecté.");
                    }}
                  >
                    Déconnecter
                  </button>
                </div>
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

function ComptesAnimateur() {
  const [animateurs, setAnimateurs] = useState([]);
  const [modalOuverte, setModalOuverte] = useState(false);
  const [erreur, setErreur] = useState("");

  useEffect(() => {
    api("/api/animateurs").then(setAnimateurs).catch((e) => setErreur(e.message));
  }, []);

  return (
    <div>
      <div style={{ ...styles.sectionHeader, marginTop: 32 }}>
        <h2 style={styles.sectionTitre}>Comptes animateur (lecture seule)</h2>
        <button style={styles.boutonAjout} onClick={() => setModalOuverte(true)}>
          <Plus size={16} strokeWidth={2.5} /> Nouvel animateur
        </button>
      </div>

      {erreur && <div style={styles.bandeauErreur}>{erreur}</div>}

      {animateurs.length === 0 ? (
        <div style={styles.videEtat}>Aucun compte animateur pour l'instant.</div>
      ) : (
        <div style={styles.tableauConteneur}>
          <table style={styles.tableau}>
            <thead>
              <tr>
                <th style={styles.th}>Nom</th>
                <th style={styles.th}>Identifiant</th>
              </tr>
            </thead>
            <tbody>
              {animateurs.map((a) => (
                <tr key={a.id} style={styles.tr}>
                  <td style={styles.td}>{a.nom}</td>
                  <td style={styles.td}>{a.identifiant}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {modalOuverte && (
        <ModalAnimateur
          onFermer={() => setModalOuverte(false)}
          onValider={async (payload) => {
            try {
              const nouveau = await api("/api/animateurs", { method: "POST", body: payload });
              setAnimateurs((prev) => [...prev, nouveau]);
              setModalOuverte(false);
            } catch (e) {
              setErreur(e.message);
            }
          }}
        />
      )}
    </div>
  );
}

            <strong>{commercial.bonus_avis_actif ? "bonus obtenu" : "bonus non obtenu"}</strong>
